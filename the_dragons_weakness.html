const trials=[
{name:'THE FIRST RIDDLE',topic:'Wrong Range',type:'Multiple Choice',col:3,situation:"Copilot reports that the average Appraised_Value for North Vault artifacts is 76.2. Inspect the five appraised values.",question:"What caused Copilot's result to be wrong?",choices:['It used AVERAGE instead of AVERAGEIF','It included the header row, treating it as zero','It excluded the Iron Helm','It calculated the total instead of the average'],answer:1,wrong:'Look at the numbers. Five artifacts with values between 88 and 96 cannot average to 76.2 unless something that does not belong is being counted. Check where the range starts.',correct:'The range started one row too early. Copilot included the column header as a data point, added a zero to the sum, and divided by six instead of five. Always confirm your data range starts on the first data row, not the header.'},
{name:'THE HIDDEN ASSUMPTION',topic:'Unstated Assumption',type:'Spot the Flaw',col:4,situation:'Varrax asked Copilot to flag artifacts needing restoration. The real rule is: flag Damaged OR Unappraised. Copilot flagged only Damaged. Click the artifact it missed.',wrong:'That artifact was handled correctly. Copilot did flag Damaged items. The problem is what it did with a different condition — one the prompt never mentioned.',correct:'Copilot was not told that Unappraised artifacts also need restoration. So it assumed they did not. When your prompt does not define every condition, Copilot fills the gap. Always list every value that should trigger an action.'},
{name:'THE CONFIDENT LIE',topic:'Transparent Results',type:'Trust Selector',col:3,situation:'Two Copilot responses answer the same question. Choose the response you can verify.',wrong:'The number is the same. But one response tells you something the other chose to omit. When Copilot excludes rows silently, you cannot verify whether those exclusions were correct.',correct:'Response B tells you what was excluded and why. That is the information you need to verify the result independently. When Copilot silently excludes blank cells, the average may be correct for the rows it used and still wrong for your actual question.'},
{name:'THE ROYAL ARCHIVE',topic:'Named Tables and Data Preparation',type:'Drag to Category',col:0,situation:'Sort each dataset state into the correct preparation zone.',wrong:'One or more items are in the wrong zone. A named table tells Copilot where the data starts and ends and what each column contains. A plain range, an abbreviated column name, or a shared sheet all increase the chance Copilot misreads the structure.',correct:'Named tables, descriptive column names, and isolated sheets are the three structural decisions that most improve how reliably Copilot reads your data. These take minutes to set up and prevent most common Copilot errors before they happen.'},
{name:'THE CATEGORY TRAP',topic:'Consistent Categories',type:'Multiple Choice',col:6,situation:'Copilot reports 1 cursed artifact from these values: No, yes, Unknown, NO, Yes, No. The true count is 2.',question:'Why did Copilot return 1 instead of 2?',choices:['It used the wrong column','It counted Unknown as Yes','The values have inconsistent capitalization and Copilot treated yes and Yes as different values','It excluded the last row'],answer:2,wrong:'The column and range are correct. The issue is subtler. Excel and Copilot both match text exactly. Two values that mean the same thing but differ in capitalization are treated as completely separate categories.',correct:'Yes and yes are different strings to Excel. Copilot counted only the exact match it was looking for. Standardize every repeating category value to one consistent spelling and capitalization before you start querying.'},
{name:'THE BLANK CELL',topic:'Blank Handling',type:'Reorder Sequence',col:3,situation:'Order these strategies from most to least useful for Copilot.',wrong:'Think about what Copilot sees when it encounters a blank. It does not know if the value is missing, zero, not applicable, or not yet recorded. The more information you give it upfront, the less it has to guess.',correct:'A named placeholder gives Copilot something to filter on. A flag column adds queryable structure without altering the original data. Leaving cells blank is the weakest option because Copilot has nothing to work with and no way to distinguish intentional gaps from accidental ones.'},
{name:'THE SPELL',topic:'Prompt Specificity and Scope',type:'Prompt Builder',col:3,situation:'Build a complete prompt by selecting the four correct tiles in order.',wrong:'The prompt needs to be specific, scoped, and clear about exclusions. A vague tile or wrong order gives Copilot room to decide things on your behalf. It will. The result will look confident.',correct:'Specificity names the metric. Scope names the column and the filter. The exclusion rule removes ambiguity about placeholder values. A prompt with all three leaves Copilot nothing to guess.'},
{name:'THE FOUR ELEMENTS',topic:'Prompt Elements',type:'Drag to Category',col:0,situation:'Sort each prompt fragment into the role it performs.',wrong:'Each element does a different job. Specificity says what you want. Context tells Copilot how to interpret your data. Scope defines which rows and columns to include. Iteration refines a result that is close but not complete.',correct:'These four elements leave Copilot nothing to assume. Not every prompt needs all four, but knowing which one is missing tells you exactly how to fix a weak result.'},
{name:'THE LADDER',topic:'Verification Sequence',type:'Reorder Sequence',col:3,situation:'Arrange the five verification steps in the correct order.',wrong:'The order matters. Sanity-checking a result before confirming the range is correct means you are evaluating a number that may be structurally wrong. Each step builds on the one before it.',correct:'Range first because a wrong range makes every other check pointless. Logic second because formula structure determines what the number means. Sanity check third as a quick gut test. Manual verification fourth to confirm with your own formula. Explanation last for complex formulas where you need Copilot to walk through its own reasoning.'},
{name:'THE STAKES',topic:'Calibrated Verification',type:'Drag to Category',col:3,situation:'Sort each scenario onto the appropriate verification level.',wrong:'Think about what happens if the number is wrong. A personal draft costs you a correction. A Royal Council presentation costs the kingdom. The stakes determine the verification level, not your confidence in Copilot.',correct:'Quick checks cover low-stakes personal work. Standard reviews cover internal sharing where errors are recoverable. Full verification covers anything consequential, external, or irreversible. Copilot\'s confidence does not change which level applies.'}

function updateHUD(){for(const [id,v] of [['score',S.score],['streak',S.streak],['weakCount',S.earned.length]]){let e=document.getElementById(id);if(e)e.textContent=v}let m=document.getElementById('muteBtn');if(m)m.textContent=S.muted?'🔇':'🔊'}
function dragonFilter(n=S.earned.length,defeat=false){if(defeat)return'grayscale(1) brightness(.55)';if(n>=10)return'grayscale(.7) brightness(.6)';if(n>=8)return'grayscale(.4) brightness(.8) hue-rotate(160deg)';if(n>=6)return'grayscale(.25) brightness(.86) hue-rotate(120deg) drop-shadow(0 0 7px #637b8a)';if(n>=4)return'brightness(.92) hue-rotate(70deg) drop-shadow(0 0 11px #8b687c)';if(n>=2)return'brightness(1) hue-rotate(30deg) drop-shadow(0 0 15px #995064)';return'drop-shadow(0 0 20px #b84f63) brightness(1.1)'}
function ledgerHTML(highlight=-1,mini=false){return `<div class="tableWrap ${mini?'miniLedger':''}"><table class="dataset"><thead><tr>${cols.map((c,i)=>`<th class="${i===highlight?'highlight':''}">${c}</th>`).join('')}</tr></thead><tbody>${ledger.map(r=>`<tr>${r.map(v=>`<td class="${v===''?'blank':''}">${v===''?'(blank)':esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function openLedger(){let hi=S.idx<10?trials[S.idx].col:-1,ov=document.createElement('div');ov.className='overlay';ov.id='ledgerModal';ov.innerHTML=`<div class="overlayCard" style="max-width:1150px;text-align:left"><button class="smallBtn modalClose" onclick="closeLedger()">✕ Close</button><h2>The Hoard Ledger</h2><p>The highlighted header is most relevant to the current trial.</p>${ledgerHTML(hi)}</div>`;document.body.appendChild(ov)}function closeLedger(){document.getElementById('ledgerModal')?.remove()}
function renderHome(){hideTop();document.getElementById('app').innerHTML=`<div class="screen"><section class="hero"><div class="kicker">A COPILOT KNOWLEDGE QUEST</div><h1>THE DRAGON'S WEAKNESS</h1><div class="subtitle">Verification. Preparation. Prompting.</div><div class="openingScroll" style="text-align:left">The kingdom of Analyst has been prosperous for decades. Then Varrax arrived — not with fire and claws, but with spreadsheets. He offered to manage every ledger, every calculation, every report. The king accepted.<br><br>The numbers always looked right. Nobody checked.<br><br>Seven years later the tribute is miscalculated, the supply routes are failing, and three vaults are mismanaged. The Royal Council meets in three days to approve Varrax's most consequential formula yet — one that will determine how resources are distributed across the entire kingdom for the next decade.<br><br>The Sphinx has been watching from the mountain. <b>She summons you.</b><div style="text-align:center"><button class="cta" onclick="renderCharacters()">Answer the Summons</button></div></div></section>${footer()}</div>`}
function renderCharacters(){document.getElementById('app').innerHTML=`<div class="screen"><section class="hero"><div class="kicker">KNOW WHO WAITS</div><h2>Two Guardians of the Ledger</h2></section><div class="cards"><article class="character"><div class="icon" style="filter:${dragonFilter()}">🐉</div><h3 style="color:#e3a7b2">VARRAX</h3><p>A dragon who manages the kingdom's spreadsheets. His formulas always return a number. Nobody has ever checked one. He finds this arrangement ideal.</p></article><article class="character"><div class="icon">🦁</div><h3 style="color:#a7ded7">THE SPHINX</h3><p>Guardian of the mountain pass. She has watched Varrax for seven years. She knows exactly what he gets wrong. She needs someone who can learn fast enough to stop him before the Council meets.</p></article></div><div style="text-align:center"><button class="cta" onclick="renderHowTo()">Continue</button></div>${footer()}</div>`}
function renderHowTo(){document.getElementById('app').innerHTML=`<div class="screen"><section class="hero"><div class="kicker">BEFORE YOU ENTER</div><h2>How to Play</h2></section><div class="introPanel"><div class="openingScroll" style="margin-top:0"><p>You will examine Copilot answers and the data behind them. Each activity asks you to identify an error, organize information, or build a stronger instruction.</p><div class="mechanics"><div class="mechanic"><b>Multiple Choice</b><br>Select the best answer.</div><div class="mechanic"><b>Spot the Flaw</b><br>Click the overlooked item.</div><div class="mechanic"><b>Trust Selector</b><br>Choose the response you can verify.</div><div class="mechanic"><b>Drag to Category</b><br>Tap an item, then tap its destination.</div><div class="mechanic"><b>Prompt Builder</b><br>Select prompt pieces in the right order.</div><div class="mechanic"><b>Reorder Sequence</b><br>Move steps up or down, then check.</div></div><p><b>Weakness Scroll:</b> Each completed trial unlocks one lesson on your scroll.</p><p><b>Three strikes:</b> A wrong answer removes a dragon scale. After three misses, the correct answer and explanation appear so you can continue.</p><p><b>The Hoard Ledger:</b> Use the 📜 Ledger button at any time to inspect the complete dataset.</p><p>Three optional mini-games break up the climb. They never block your progress.</p><div style="text-align:center"><button class="cta" onclick="renderTutorial()">Enter the Mountain</button></div></div></div>${footer()}</div>`}
function renderTutorial(){showTop();document.getElementById('app').innerHTML=`<div class="screen"><section class="hero" style="padding-bottom:12px"><div class="kicker">YOUR SOURCE OF TRUTH</div><h2>The Hoard Ledger</h2><p>This is the full dataset you will audit. You can reopen it anytime with the <b>📜 Ledger</b> button above.</p></section><div class="panel" style="padding:18px">${ledgerHTML()}<div class="colGuide"><div><b>Artifact_Name</b> identifies the object.</div><div><b>Vault</b> gives its location.</div><div><b>Material</b> records what it is made from.</div><div><b>Appraised_Value</b> records its value in gold marks.</div><div><b>Condition</b> records its restoration state.</div><div><b>Appraiser</b> names who evaluated it.</div><div><b>Cursed</b> records whether a curse is known.</div></div><div class="feedback"><b>Sphinx:</b> This ledger is your evidence. Copilot may summarize it. Varrax may interpret it. Neither replaces it.</div><div style="text-align:center"><button class="cta" onclick="startTrials()">Begin Trial 1</button></div></div>${footer()}</div>`}
function startTrials(){S.idx=0;renderTrial()}
function sidebarHTML(){let names=['Dubious','Adequate','Promising','Irritatingly Competent','Worthy'],comments=['The Sphinx is reserving judgment.','The Sphinx has slightly raised an eyebrow.','The Sphinx is taking notes.','The Sphinx has stopped pretending not to be impressed.','The Sphinx has nothing further to say. That is the highest praise.'];return `<aside class="sidebar"><div class="scrollTitle">THE WEAKNESS SCROLL</div>${weaknesses.map((w,i)=>`<div class="weakness ${i<S.earned.length?'unlocked':''}">${i<S.earned.length?'✨':'🔒'} ${w}</div>`).join('')}<div class="estimate"><b>Sphinx's Estimation</b><div style="font-size:.78rem;color:var(--muted)">Rises when you answer correctly on the first try</div><div class="estTrack"><div class="estFill" style="width:${[0,25,50,75,100][S.est]}%"></div></div><b>${names[S.est]}</b><div style="font-size:.78rem;color:var(--muted);margin-top:4px">${comments[S.est]}</div></div><div class="varraxPortrait"><div class="scrollTitle">VARRAX'S CONFIDENCE</div><div class="dragonPortrait" style="filter:${dragonFilter()};opacity:${S.earned.length>=10?.72:1}">🐉</div><div style="font-size:.78rem;color:var(--muted)">${Math.max(10,100-S.earned.length*9)}% and objecting</div></div><details class="ledgerToggle"><summary>Ledger</summary>${ledgerHTML(S.idx<10?trials[S.idx].col:-1,true)}</details></aside>`}
function strikesHTML(){return `<div class="strikes" aria-label="${S.strikes} strikes remaining">${[0,1,2].map(i=>`<span class="scale ${i<S.strikes?'':'lost'}">◆</span>`).join('')}</div>`}
function renderTrial(){S.strikes=3;S.locked=false;S.selected=null;let t=trials[S.idx];document.body.classList.remove('hasSelection');document.getElementById('app').innerHTML=`<div class="screen"><div class="layout"><section class="panel"><div class="stationHead"><div><div class="trial">TRIAL ${S.idx+1} OF 10</div><div class="room">${t.name}</div><div class="topic">${t.topic}</div></div><div><div class="typePill">${t.type}</div>${strikesHTML()}</div></div><div class="dialogue sphinx"><div class="speaker">🦁</div><div><div class="speakerName">THE SPHINX</div><div class="speakerText">${t.situation}</div></div></div><div class="dialogue varrax"><div class="speaker" style="filter:${dragonFilter()}">🐉</div><div><div class="speakerName">VARRAX</div><div class="speakerText">${esc(varraxLines[S.idx])}</div></div></div><div class="question">${trialBody()}<div class="feedbackHost"></div></div></section>${sidebarHTML()}</div>${footer()}</div>`;updateHUD();window.scrollTo({top:0,behavior:'smooth'})}
function trialBody(){let t=trials[S.idx];if(S.idx===0){let rows=ledger.filter(r=>r[1]==='North Vault'&&r[3]);return `${copilot('What is the average Appraised_Value for North Vault artifacts?','The average is <b>76.2 gold marks</b>.')}${smallTable(['Artifact_Name','Appraised_Value'],rows.map(r=>[r[0],r[3]]),1)}<h3>${t.question}</h3>${mc(t)}`};if(S.idx===1){let rows=[['Dragon Fang Chalice','Pristine','not flagged'],['Ember Shield','Damaged','Flagged'],['Moonstone Ring','Damaged','Flagged'],['Void Compass','Unappraised','not flagged'],['Rusted Gauntlet','Damaged','Flagged']];return `<h3>Click the missed artifact.</h3><div class="tableWrap"><table class="dataset"><tr><th>Artifact</th><th>Condition</th><th>Copilot Result</th></tr>${rows.map((r,i)=>`<tr class="${r[2]==='Flagged'?'flagged':''}"><td><button class="option" onclick="spot(this,${i===3},'${esc(r[0])}')">${r[0]}</button></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`};if(S.idx===2)return `<div class="grid2"><div class="trustCard"><h3>Response A</h3><p>North Vault has the highest average appraised value at 91.4 gold marks.</p><button class="trustBtn" onclick="trust(this,false,'Response A')">Trust A</button></div><div class="trustCard"><h3>Response B</h3><p>North Vault has the highest average appraised value at 91.4 gold marks. <b>Note:</b> 3 artifacts in the Hidden Chamber and 1 in the North Vault have no appraised value recorded and were excluded from this calculation.</p><button class="trustBtn" onclick="trust(this,true,'Response B')">Trust B</button></div></div>`;if(S.idx===3)return category('cat4',[["Hoard Ledger converted to a named Excel Table called HoardLedger",'ready'],['Hoard Ledger sitting in a plain range with no table structure','fix'],['Column named AV','fix'],['Column named Appraised_Value','ready'],["Dataset sharing a sheet with Varrax's personal expense claims",'fix'],['Dataset on its own dedicated sheet with nothing else on it','ready']],[['ready','READY FOR COPILOT'],['fix','NEEDS FIXING FIRST']]);if(S.idx===4)return `${copilot('Count artifacts where Cursed equals Yes.','1 cursed artifact found.')}${smallTable(['Cursed'],[['No'],['yes'],['Unknown'],['NO'],['Yes'],['No']],0)}<h3>${t.question}</h3>${mc(t)}`;if(S.idx===5){setSeq([['Fill blank cells with the text Unappraised so Copilot can filter them explicitly',0],['Add an Appraised_Flag column with Yes or No for each artifact',1],['Leave cells blank and rely on Copilot to handle them correctly',2]]);return sequence('seq6')};if(S.idx===6){window.promptParts=[];let arr=[['What is the average',1],['from the Appraised_Value column',1],['for artifacts in the North Vault',1],['excluding Unappraised entries',1],['analyze the data',0],['show me something interesting',0],['for all vaults',0],['including blanks',0]].sort(()=>Math.random()-.5);return `<div id="spell" class="spell">The inscription waits.</div><div class="dragBank">${arr.map(x=>`<button class="tile" onclick="promptTile(this,'${encodeURIComponent(x[0])}',${x[1]})">${x[0]}</button>`).join('')}</div>`};if(S.idx===7)return category('cat8',[["What is the highest Appraised_Value in the dataset?",'specificity'],['The Condition column contains Pristine, Damaged, and Unappraised','context'],['Calculate the average from the Appraised_Value column for North Vault artifacts only','scope'],['Recalculate excluding Unappraised entries and show each vault separately','iteration']],[['specificity','SPECIFICITY'],['context','CONTEXT'],['scope','SCOPE'],['iteration','ITERATION']]);if(S.idx===8){setSeq([['Check the range',0],['Check the logic',1],['Sanity-check the result',2],['Verify one result manually',3],['Ask Copilot to explain',4]]);return sequence('seq9')};return category('cat10',[["A count of North Vault artifacts for your own notes",'quick'],['An average Appraised_Value calculation for an internal team meeting','standard'],['A total hoard value being presented to the Royal Council tomorrow','full'],['A formula draft still in your personal ledger','quick'],["A vault comparison being sent to the kingdom's treasurer",'full'],["A supply count for the quartermaster's weekly briefing",'standard']],[['quick','🟢 QUICK CHECK'],['standard','🟡 STANDARD REVIEW'],['full','🔴 FULL VERIFICATION']])}
function copilot(p,r){return `<div class="copilot"><div class="copHead">✦ Copilot</div><div class="prompt">${esc(p)}</div><div>${r}</div></div>`}function smallTable(h,rows,hi=-1){return `<div class="tableWrap"><table class="dataset"><tr>${h.map((x,i)=>`<th class="${i===hi?'highlight':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`}function mc(t){return t.choices.map((x,i)=>`<button class="option" data-correct="${i===t.answer}" onclick="answerMC(this,${i})">${String.fromCharCode(65+i)}) ${x}</button>`).join('')}
function record(answer,ok,forced=false){let existing=S.answers[S.idx];if(!existing)S.answers[S.idx]={trial:S.idx,answer,firstCorrect:ok&&!forced,correct:ok,feedback:trials[S.idx].correct};else{existing.answer=answer;existing.correct=ok}}
function wrongAttempt(answer){if(S.locked)return;S.wrong++;S.streak=0;S.strikes--;sound.wrong();record(answer,false);document.querySelectorAll('.scale').forEach((x,i)=>x.classList.toggle('lost',i>=S.strikes));updateHUD();if(S.strikes<=0)return revealAnswer();document.querySelector('.feedbackHost').innerHTML=`<div class="feedback bad">${trials[S.idx].wrong}<br><b>${S.strikes} strike${S.strikes===1?'':'s'} remaining.</b></div>`}
function revealAnswer(){S.locked=true;document.querySelectorAll('[data-correct="true"]').forEach(x=>x.classList.add('correct'));document.querySelectorAll('.option,.trustBtn,.dragItem,.tile,.mini,.checkBtn').forEach(x=>x.classList.add('disabled'));toast(`<b>Varrax:</b> ${['THE HEADER REMAINS HISTORICALLY IMPORTANT.','THREE ATTEMPTS. I AM FEELING RESTORED.','TRANSPARENCY IS OVERRATED.','THE PLAIN RANGE SURVIVES.','CAPITALIZATION HAS DEFEATED YOU.','THE BLANKS REMAIN PEACEFUL.','VAGUENESS PREVAILS.','SOME ELEMENTS ARE OPTIONAL NOW.','THE LADDER HAS COLLAPSED.','AT LAST, SOMEONE WHO OVERCHECKS.'][S.idx]}`,3000);finishTrial(trials[S.idx].correct,true)}
function answerMC(btn,i){if(S.locked)return;let ok=i===trials[S.idx].answer;btn.classList.add(ok?'correct':'wrong');ok?(record(trials[S.idx].choices[i],true),finishTrial()):wrongAttempt(trials[S.idx].choices[i])}
function spot(btn,ok,label){if(S.locked)return;btn.classList.add(ok?'correct':'wrong');ok?(record(label,true),finishTrial()):wrongAttempt(label)}function trust(btn,ok,label){if(S.locked)return;btn.classList.add(ok?'correct':'wrong');ok?(record(label,true),finishTrial()):wrongAttempt(label)}
function category(kind,items,zones){window.catExpected=window.catExpected||{};window.catExpected[kind]=items.map(x=>x[1]);return `<div id="${kind}Bank" class="dragBank">${items.map((x,i)=>dragItem(x[0],kind,i)).join('')}</div>${zones.map(z=>`<div class="dropZone" data-kind="${kind}" data-cat="${z[0]}" onclick="tapZone(this)" ondragover="event.preventDefault()" ondrop="dropZone(event,this)"><b>${z[1]}</b><div class="slotContent"></div></div>`).join('')}<button class="checkBtn" onclick="checkCategory('${kind}')">Check</button>`}
function dragItem(text,kind,i){return `<button class="dragItem" draggable="true" data-kind="${kind}" data-i="${i}" data-text="${encodeURIComponent(text)}" onclick="selectItem(this)" ondragstart="dragStart(event)">${text}</button>`}function selectItem(el){if(S.locked)return;document.querySelectorAll('.dragItem').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');S.selected={kind:el.dataset.kind,i:+el.dataset.i,text:decodeURIComponent(el.dataset.text)};document.body.classList.add('hasSelection')}function dragStart(e){e.dataTransfer.setData('text/plain',JSON.stringify({kind:e.currentTarget.dataset.kind,i:+e.currentTarget.dataset.i,text:decodeURIComponent(e.currentTarget.dataset.text)}))}function placeItem(d,z){let el=[...document.querySelectorAll('.dragItem')].find(x=>x.dataset.kind===d.kind&&+x.dataset.i===d.i);if(el)z.querySelector('.slotContent').appendChild(el);el?.classList.remove('selected');S.selected=null;document.body.classList.remove('hasSelection')}function tapZone(z){if(S.selected&&S.selected.kind===z.dataset.kind)placeItem(S.selected,z)}function dropZone(e,z){e.preventDefault();try{let d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.kind===z.dataset.kind)placeItem(d,z)}catch{}}
function checkCategory(kind){if(S.locked)return;let bank=document.getElementById(kind+'Bank'),bad=[];document.querySelectorAll(`.dropZone[data-kind="${kind}"] .dragItem`).forEach(el=>{let zone=el.closest('.dropZone');if(window.catExpected[kind][+el.dataset.i]!==zone.dataset.cat)bad.push(el)});if(bank.children.length||bad.length){bad.forEach(el=>{el.classList.add('wrong');bank.appendChild(el);setTimeout(()=>el.classList.remove('wrong'),600)});wrongAttempt('One or more items were misplaced or left in the bank');return}record('All items categorized',true);finishTrial()}
function setSeq(a){S.seq=a.sort(()=>Math.random()-.5)}function sequence(id){return `<div id="${id}List" class="sequence">${seqItems(id)}</div><button class="checkBtn" style="margin-top:12px" onclick="checkSequence('${id}')">Check Order</button>`}function seqItems(id){return S.seq.map((x,i)=>`<div class="seqItem"><b>${i+1}</b><span>${x[0]}</span><span class="seqBtns"><button class="mini" onclick="moveSeq(${i},-1,'${id}')" aria-label="Move up">↑</button><button class="mini" onclick="moveSeq(${i},1,'${id}')" aria-label="Move down">↓</button></span></div>`).join('')}function moveSeq(i,d,id){if(S.locked)return;let j=i+d;if(j<0||j>=S.seq.length)return;[S.seq[i],S.seq[j]]=[S.seq[j],S.seq[i]];document.getElementById(id+'List').innerHTML=seqItems(id)}function checkSequence(id){if(S.locked)return;let ok=S.seq.every((x,i)=>x[1]===i);if(ok){record(S.seq.map(x=>x[0]).join(' → '),true);finishTrial()}else wrongAttempt('Sequence submitted in the wrong order')}
function promptTile(btn,txt,good){if(S.locked)return;let t=decodeURIComponent(txt),order=['What is the average','from the Appraised_Value column','for artifacts in the North Vault','excluding Unappraised entries'];if(!good||t!==order[window.promptParts.length]){btn.classList.add('wrong');wrongAttempt(t);return}window.promptParts.push(t);btn.classList.add('used');let s=document.getElementById('spell');s.textContent=window.promptParts.join(' ');s.classList.add('glow');if(window.promptParts.length===4){record(s.textContent,true);finishTrial()}}
function advanceEstimate(){S.est=Math.min(4,Math.floor(S.firstTry/2.5))}
function finishTrial(message=null,forced=false){if(S.locked&&!forced)return;S.locked=true;let first=S.strikes===3&&!forced;if(first){S.firstTry++;S.streak++;S.score+=100+10*S.streak}else{S.streak=0;if(!forced)S.score+=S.strikes===2?50:20}if(!S.answers[S.idx])record('Correct answer revealed',false,true);S.earned.push(weaknesses[S.idx]);advanceEstimate();sound.correct();setTimeout(sound.fanfare,220);document.querySelectorAll('.option,.trustBtn,.dragItem,.tile,.mini,.checkBtn').forEach(x=>x.classList.add('disabled'));document.querySelector('.feedbackHost').innerHTML=`<div class="feedback ok">${message||trials[S.idx].correct}<br><br><b>Weakness earned:</b> ✨ ${weaknesses[S.idx]}<br><button class="nextBtn" onclick="nextTrial()">Continue</button></div>`;updateHUD();let side=document.querySelector('.sidebar');if(side)side.outerHTML=sidebarHTML()}
function nextTrial(){if(S.idx===2)return miniRiddle(false);if(S.idx===5)return miniDodge(false);if(S.idx===8)return miniSorter(false);if(S.idx===9)return storyBeat('THE ROYAL COUNCIL','🦁 The scroll is complete. Use what you earned. The Council is waiting.',renderBoss);S.idx++;if(S.idx===3)return storyBeat('MOVEMENT ON THE MOUNTAIN','Varrax has noticed movement on the mountain. He is not worried yet. He has seventeen unchecked formulas and considerable confidence.',renderTrial);if(S.idx===6)return storyBeat('THE AUDIT IS DISCOVERED','Varrax realizes someone is auditing his books. He is audibly upset. From somewhere deep in the mountain you hear the sound of a dragon trying to manually recalculate a SUMIF.',renderTrial);if(S.idx===9)return storyBeat('THE FINAL ASCENT','🦁 Nine weaknesses. One trial remains. The Council meets tomorrow. Varrax has one formula left and he knows you are coming.',renderTrial);renderTrial()}
function storyBeat(title,text,cb){let ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="overlayCard"><h2>${title}</h2><p>${text}</p><button class="cta" id="beatNext">Continue</button></div>`;document.body.appendChild(ov);document.getElementById('beatNext').onclick=()=>{ov.remove();cb()}}
function miniRiddle(standalone){S.standalone=standalone;let time=20,ov=document.createElement('div');ov.className='overlay';ov.id='miniOverlay';ov.innerHTML=`<div class="overlayCard"><div class="kicker">MINI-GAME 1</div><h2>The Sphinx's Riddle</h2><div class="countdown" id="miniTimer">20</div><p style="font-size:1.2rem">“I speak without a mouth and hear without ears. I have no body but come alive with wind. What am I?”</p>${['A ghost','An echo','A shadow','A formula'].map((x,i)=>`<button class="option" onclick="answerRiddle(${i===1})">${String.fromCharCode(65+i)}) ${x}</button>`).join('')}<div id="miniFeedback"></div></div>`;document.body.appendChild(ov);clearTimers();timers.push(setInterval(()=>{time--;let e=document.getElementById('miniTimer');if(e)e.textContent=time;if(time<=0){clearTimers();answerRiddle(false,true)}},1000))}function answerRiddle(ok,timeout=false){clearTimers();document.querySelectorAll('#miniOverlay .option').forEach((x,i)=>{x.classList.add('disabled');if(i===1)x.classList.add('correct')});document.getElementById('miniFeedback').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'Correct. I am mildly impressed. Do not let it go to your head.':'An echo. It was an echo. This is why I do not give riddles to dragons.'}<br><button class="nextBtn" onclick="closeMini(1)">Continue</button></div>`;S.miniScores[0]=ok?1:0}
function miniDodge(standalone){S.standalone=standalone;let ov=document.createElement('div');ov.className='overlay';ov.id='miniOverlay';ov.innerHTML=`<div class="overlayCard"><div class="kicker">MINI-GAME 2</div><h2>Dragon Dodge</h2><p>Tap the shield as each fireball reaches it. The timing window is generous.</p><div class="minigameArea" id="dodgeArea"><div id="dodgeStatus">Prepare yourself.</div><button class="shieldBtn" onclick="raiseShield()" aria-label="Raise shield">🛡️</button></div></div>`;document.body.appendChild(ov);window.dodge={shot:0,blocked:0,active:false};setTimeout(nextFireball,700)}function nextFireball(){if(!document.getElementById('dodgeArea'))return;if(window.dodge.shot>=3){let b=window.dodge.blocked;if(b===3){S.score+=30;S.ach.add('Flameproof');}S.miniScores[1]=b;document.getElementById('dodgeStatus').innerHTML=`Blocked ${b} of 3. ${b===0?'🐉 I EXPECTED MORE SHIELDING.':b<3?'🦁 I deflected the rest. You are welcome.':'🦁 Adequate shield work. Almost elegant.'}<br><button class="nextBtn" onclick="closeMini(2)">Continue</button>`;updateHUD();return}window.dodge.shot++;window.dodge.active=true;sound.whoosh();let f=document.createElement('div');f.className='fireball';f.textContent='🔥';document.getElementById('dodgeArea').appendChild(f);setTimeout(()=>{window.dodge.active=false;f.remove();nextFireball()},2500)}function raiseShield(){if(!window.dodge?.active)return;let f=document.querySelector('.fireball');if(!f)return;let left=f.getBoundingClientRect().left,area=document.getElementById('dodgeArea').getBoundingClientRect();if(left>area.left+area.width*.48){window.dodge.active=false;window.dodge.blocked++;sound.clang();f.textContent='✨';f.style.animationPlayState='paused';setTimeout(()=>{f.remove();nextFireball()},450)}}
function miniSorter(standalone){S.standalone=standalone;let items=[['Dragon Fang Chalice','North'],['Ember Shield','South'],['Void Compass','Hidden'],['Iron Helm','North'],['Silver Goblet','South'],['Shadowblade','Hidden'],['Curse Stone','South'],['Gilded Skull','North']].sort(()=>Math.random()-.5),ov=document.createElement('div');ov.className='overlay';ov.id='miniOverlay';window.sortExpected=items.map(x=>x[1]);window.sortTime=20;window.sortDone=0;window.sortPoints=0;ov.innerHTML=`<div class="overlayCard"><div class="kicker">MINI-GAME 3</div><h2>Artifact Sorter</h2><div class="timer">Time: <span id="sortTime">20</span>s · Bonus: <span id="sortPts">0</span></div><p>Tap an artifact, then tap its vault.</p><div id="sortBank" class="dragBank">${items.map((x,i)=>dragItem(x[0],'sort',i)).join('')}</div><div class="bins">${[['North','North Vault'],['South','South Vault'],['Hidden','Hidden Chamber']].map(z=>`<div class="dropZone" data-kind="sort" data-cat="${z[0]}" onclick="sortPlace(this)" ondragover="event.preventDefault()" ondrop="sortDrop(event,this)"><b>${z[1]}</b><div class="slotContent"></div></div>`).join('')}</div><div id="sortFeedback"></div></div>`;document.body.appendChild(ov);clearTimers();timers.push(setInterval(()=>{window.sortTime--;let e=document.getElementById('sortTime');if(e)e.textContent=window.sortTime;if(window.sortTime<=0)finishSorter()},1000))}function sortPlace(z){if(!S.selected||S.selected.kind!=='sort')return;sortEvaluate(S.selected,z)}function sortDrop(e,z){e.preventDefault();try{let d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.kind==='sort')sortEvaluate(d,z)}catch{}}function sortEvaluate(d,z){let el=[...document.querySelectorAll('.dragItem')].find(x=>x.dataset.kind==='sort'&&+x.dataset.i===d.i);if(!el)return;if(window.sortExpected[d.i]===z.dataset.cat){z.querySelector('.slotContent').appendChild(el);el.classList.add('correct','disabled');window.sortPoints+=10;window.sortDone++;document.getElementById('sortPts').textContent=window.sortPoints;if(window.sortDone===8)finishSorter()}else{el.classList.add('wrong');toast('<b>Varrax:</b> I also store artifacts wherever there is room.',1300);setTimeout(()=>el.classList.remove('wrong'),500)}S.selected=null;document.body.classList.remove('hasSelection')}function finishSorter(){clearTimers();S.score+=window.sortPoints||0;S.miniScores[2]=window.sortPoints||0;document.querySelectorAll('#miniOverlay .dragItem').forEach(x=>x.classList.add('disabled'));document.getElementById('sortFeedback').innerHTML=`<div class="feedback ok">You sorted ${window.sortDone||0} of 8 artifacts and earned ${window.sortPoints||0} bonus points.<br><button class="nextBtn" onclick="closeMini(3)">Continue</button></div>`;updateHUD()}function closeMini(n){clearTimers();document.getElementById('miniOverlay')?.remove();if(S.standalone){S.standalone=false;return}S.idx++;if(n===1)storyBeat('MOVEMENT ON THE MOUNTAIN','Varrax has noticed movement on the mountain. He is not worried yet. He has seventeen unchecked formulas and considerable confidence.',renderTrial);else if(n===2)storyBeat('THE AUDIT IS DISCOVERED','Varrax realizes someone is auditing his books. He is audibly upset. From somewhere deep in the mountain you hear the sound of a dragon trying to manually recalculate a SUMIF.',renderTrial);else storyBeat('THE FINAL ASCENT','🦁 Nine weaknesses. One trial remains. The Council meets tomorrow. Varrax has one formula left and he knows you are coming.',renderTrial)}function clearTimers(){timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[]}
function renderBoss(){S.bossPhase=0;document.getElementById('app').innerHTML=`<div class="screen"><div class="layout"><section class="panel"><div class="question bossWrap"><div class="kicker">THE ROYAL COUNCIL</div><div id="bossDragon" class="dragonPortrait" style="filter:${dragonFilter(10)}">🐉</div><h2>VARRAX PRESENTS HIS FORMULA</h2><div>VARRAX'S CONFIDENCE</div><div class="confTrack"><div id="confFill" class="confFill" style="width:100%"></div></div><div id="bossStatus">100%</div><div id="bolts" class="bolts">🔒 🔒 🔒</div><div id="bossPanel" class="bossPanel">${bossBody()}</div></div></section>${sidebarHTML()}</div>${footer()}</div>`}function bossBody(){if(S.bossPhase===0)return `<h3>PHASE 1 — WRONG RANGE</h3><div class="formula">=AVERAGEIF(B1:B50, "North Vault", D1:D50)</div><p>Varrax's range includes the header. Where should the data begin?</p><button class="option" onclick="bossAnswer(false)">Row 1</button><button class="option" onclick="bossAnswer(true)">Row 2</button>`;if(S.bossPhase===1)return `<h3>PHASE 2 — HIDDEN ASSUMPTION</h3><p>Varrax's restoration report flags Damaged artifacts only. What was silently excluded?</p><button class="option" onclick="bossAnswer(false)">Pristine artifacts</button><button class="option" onclick="bossAnswer(true)">Unappraised artifacts</button><button class="option" onclick="bossAnswer(false)">Gold artifacts</button>`;return `<h3>PHASE 3 — CALIBRATED VERIFICATION</h3><p>The Council is about to approve kingdom-wide resource distribution based on this formula.</p><div class="levelRow"><button class="levelBtn" onclick="bossLevel(this,'quick')">🟢 Quick Check</button><button class="levelBtn" onclick="bossLevel(this,'standard')">🟡 Standard Review</button><button class="levelBtn" onclick="bossLevel(this,'full')">🔴 Full Verification</button></div><div id="bossSeq"></div>`}
function setConfidence(v){document.getElementById('confFill').style.width=v+'%';document.getElementById('bossStatus').textContent=v?`${v}%`:'STATUS: AUDITED';document.getElementById('bossDragon').style.filter=v===0?dragonFilter(10,true):dragonFilter(v<50?10:8);document.getElementById('bossDragon').style.opacity=v===0?.4:.8}function bossAnswer(ok){if(!ok){S.bossWrong++;sound.wrong();toast(`<b>Varrax:</b> ${S.bossPhase===0?'THE HEADER STAYS. THE HEADER IS TRADITION.':'THE ASSUMPTION WAS WORKING. NOBODY CHECKED. THAT IS THE DEFINITION OF WORKING.'}`,2800);return}sound.correct();S.score+=50;if(S.bossPhase===0){setConfidence(67);document.getElementById('bolts').textContent='🔓 🔒 🔒'}else{setConfidence(34);document.getElementById('bolts').textContent='🔓 🔓 🔒'}S.bossPhase++;setTimeout(()=>document.getElementById('bossPanel').innerHTML=bossBody(),900)}function bossLevel(btn,level){document.querySelectorAll('.levelBtn').forEach(x=>x.classList.remove('correct','wrong'));if(level!=='full'){btn.classList.add('wrong');S.bossWrong++;sound.wrong();toast('<b>Sphinx:</b> The Royal Council tomorrow. This is not a personal draft.');return}btn.classList.add('correct');setSeq([['Check the range',0],['Check the logic',1],['Sanity-check the result',2],['Verify one result manually',3],['Ask Copilot to explain',4]]);document.getElementById('bossSeq').innerHTML=`<div style="margin-top:16px"><h3>Arrange the verification ladder.</h3>${sequence('boss')}</div>`}function checkSequence(id){if(id==='boss'){if(S.seq.every((x,i)=>x[1]===i))defeatBoss();else{S.bossWrong++;sound.wrong();toast('<b>Sphinx:</b> A verification ladder assembled out of order is debris.')}return}if(S.locked)return;let ok=S.seq.every((x,i)=>x[1]===i);ok?(record(S.seq.map(x=>x[0]).join(' → '),true),finishTrial()):wrongAttempt('Sequence submitted in the wrong order')}function defeatBoss(){S.score+=50;S.ach.add('The Auditor');if(S.bossWrong===0)S.ach.add('No Assumptions');setConfidence(0);document.getElementById('bolts').textContent='🔓 🔓 🔓';sound.resolve();document.getElementById('bossPanel').innerHTML=`<h3>VARRAX DEFEATED</h3><p><b>Varrax:</b> You checked the range. You identified the assumption. You knew the stakes. This is embarrassing for me.</p><p style="font-size:1.4rem">🦁 <b>Sphinx:</b> “Yes.”</p><button class="nextBtn" onclick="renderEnd()">See Your Result</button>`;updateHUD()}
function renderEnd(){hideTop();let n=S.firstTry,perfect=n>=9,mid=n>=6,rank=perfect?'THE KINGDOM\'S NEW ANALYST':mid?'KNIGHT COMMANDER':'ASPIRING PAGE',flavor=perfect?'Varrax quietly closes his spreadsheet, mutters that headers are a perfectly reasonable place to start a range, and leaves. The Sphinx says: “You verified it. That is all I needed to know.” The king hands the hoard ledger to you.':mid?`Varrax is wounded but not finished. He will return with new formulas. You missed ${S.answers.filter(x=>x&&!x.firstCorrect).map(x=>`Trial ${x.trial+1}`).join(', ')||'no recorded trials'}, but the kingdom is safer than it was.`:'Varrax\'s formula passes the Council. The Sphinx is unsurprised. “The mountain is still there. So am I. So is the ledger. Come back.”',est=['Dubious','Adequate','Promising','Irritatingly Competent','Worthy'][S.est];document.getElementById('app').innerHTML=`<div class="screen"><section class="end"><div class="kicker">QUEST COMPLETE</div><h1>THE DRAGON'S WEAKNESS</h1><div class="rank">${rank}</div><p style="max-width:720px;margin:auto">${flavor}</p><div class="stats"><div class="stat"><b>${S.score}</b><br>Score</div><div class="stat"><b>${S.earned.length}/10</b><br>Weaknesses</div><div class="stat"><b>${S.firstTry}/10</b><br>First-try correct</div><div class="stat"><b>${S.wrong}</b><br>Wrong answers</div><div class="stat"><b>${est}</b><br>Sphinx estimation</div><div class="stat"><b>${S.bossWrong}</b><br>Boss misses</div></div><h3>Achievements</h3><div class="achievements">${[...S.ach].map(a=>`<span class="badge">🏆 ${a}</span>`).join('')||'<span class="badge">The Climb Continues</span>'}</div><section class="endSection"><h2>Review All Trials</h2>${trials.map((t,i)=>{let a=S.answers[i]||{answer:'Correct answer revealed',firstCorrect:false};return `<article class="reviewCard ${a.firstCorrect?'':'missed'}"><button class="reviewHead" onclick="this.nextElementSibling.classList.toggle('hidden')"><b>Trial ${i+1}: ${t.name}</b><br>${a.firstCorrect?'✓ Correct on first try':'Review recommended'}</button><div class="reviewBody hidden"><p><b>Question:</b> ${t.question||t.situation}</p><p><b>Your answer:</b> ${esc(a.answer)}</p><p><b>Explanation:</b> ${t.correct}</p></div></article>`}).join('')}</section><section class="endSection"><h2>Replay Mini-Games</h2><div class="levelRow"><button class="levelBtn" onclick="miniRiddle(true)">Sphinx's Riddle</button><button class="levelBtn" onclick="miniDodge(true)">Dragon Dodge</button><button class="levelBtn" onclick="miniSorter(true)">Artifact Sorter</button></div></section><button class="cta" onclick="resetGame()">Play Again</button></section>${footer()}</div>`}function resetGame(){clearTimers();S={idx:0,score:0,streak:0,firstTry:0,wrong:0,earned:[],est:0,strikes:3,locked:false,answers:[],seq:[],selected:null,bossPhase:0,bossWrong:0,ach:new Set(),muted:S.muted,miniScores:[null,null,null],standalone:false};renderHome()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLedger()});renderHome();
</script></body></html>
