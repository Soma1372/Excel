<body>
<div id="topbar" class="topbar hidden">
 <div class="topgrid">
  <div><div class="estLabel">SPHINX'S ESTIMATION</div><div class="estTrack"><div id="estFill" class="estFill"></div></div><div id="estStage" class="estStage">Dubious</div></div>
  <div class="hudCenter">Score: <b id="score">0</b> &nbsp; <span class="streak">🔥 <span id="streak">0</span></span></div>
  <div class="hudRight">Weaknesses: <b id="weakCount">0</b>/10</div>
 </div>
</div>
<div id="app"></div><div id="toastHost"></div>
<script>
const COPYRIGHT="© Dr. Amir Fard Bahreini";
const weaknessScroll=["Correct Data Check","Explicit Rules","Transparency","Named Tables","Consistent Categories","Blank Handling","Specific Prompts","Business Rules","Verification Ladder","Calibrated Verification"];
const stations=[
{id:1,name:"THE FIRST RIDDLE",topic:"Verification mindset",type:"Multiple Choice",weak:"Wrong Range",scroll:"Correct Data Check",
sphinx:"The answer arrived quickly. Varrax's formulas always arrive quickly. Speed, the Sphinx observes, is frequently the problem.",
situation:"Inspect Copilot's answer and the data range below.",setup:"station1",
q:"What did Copilot do wrong?",choices:[
["It used the wrong function",0],["It included the header row in the calculation",1],["It filtered for the wrong department",0],["It rounded the result incorrectly",0]],
right:"The range began one row too early. Copilot counted the words Artifact_Value as treasure. Varrax considers labels a perfectly acceptable form of currency. His first weakness is yours.",
wrong:"An interesting choice. Incorrect, naturally. The function is correct. Look at where the data begins.",varrax:"THE FORMULA CALCULATES. THAT IS ENOUGH. MOVE ON."},
{id:2,name:"THE HIDDEN ASSUMPTION",topic:"Business rules",type:"Spot the Flaw",weak:"Hidden Assumptions",scroll:"Explicit Rules",
sphinx:"Copilot answered the question you typed. The Sphinx is more interested in the question you meant. These are often different documents.",situation:"The Supply_Status column has three values: Fully Supplied, Low Supply, and Depleted. The kingdom's rule is that both Low Supply and Depleted outposts need follow-up. Copilot only flagged one of them. Click the value it quietly ignored.",setup:"station2",
right:"Low Supply outposts also needed follow-up. Copilot was not told this, so it quietly decided the kingdom could probably spare a few watchtowers.",
wrong:"That element is not the problem. Copilot did not ignore it — it ignored something else."},
{id:3,name:"THE CONFIDENT LIE",topic:"Transparency",type:"Trust Selector",weak:"Transparency Check",scroll:"Transparency",
sphinx:"Both responses contain the same number. One of them has told you something the other chose to omit. The Sphinx suggests this distinction matters in kingdoms and spreadsheets alike.",situation:"Choose the response you trust more.",setup:"station3",
right:"Transparency about exclusions is not a courtesy. It is the difference between a result and an answer.",
wrong:"The number is identical. The information is not. One tells you what it ignored. That changes everything."},
{id:4,name:"THE ROYAL ARCHIVE",topic:"Data preparation",type:"Drag to Category",weak:"Named Tables",scroll:"Named Tables",
sphinx:"Varrax thrives in unstructured ranges. He finds them cozy. A named table is, to him, the spreadsheet equivalent of sunlight. The Sphinx invites you to make his life uncomfortable.",situation:"Sort each dataset state into the correct preparation zone.",setup:"station4",
right:"The archive is prepared. Even Copilot may now enter without being eaten by metadata.",wrong:"An item is misplaced. Copilot would have guessed. Badly."},
{id:5,name:"THE CATEGORY TRAP",topic:"Consistent categories",type:"Multiple Choice",weak:"Consistent Categories",scroll:"Consistent Categories",
sphinx:"Excel matches text exactly. It does not guess. It does not infer. It does not consult context. Neither does Varrax, which is why he considers this a feature.",situation:"Inspect the inconsistent Payment_Status values.",setup:"station5",
q:"Copilot returned 4. The true count is 5. What went wrong?",choices:[
["Copilot used the wrong column",0],["The category values have inconsistent capitalization — Copilot treated each variant as a separate category",1],["The formula range was too small",0],["Copilot misread the prompt",0]],
right:"Four spellings. One meaning. Excel is not a court wizard. It will not infer your intent from the moon.",wrong:"Four is a number. It is not the right number. Exact text matching does not forgive spelling variations."},
{id:6,name:"THE BLANK CELL",topic:"Blank handling",type:"Reorder / Sequence",weak:"Blank Handling",scroll:"Blank Handling",
sphinx:"A blank cell is not empty. It is a decision that was never made. Varrax prefers undocumented decisions. They are harder to question.",situation:"Rank the three strategies from most to least informative for Copilot.",setup:"station6",
right:"A blank with a name is no longer a mystery. “Unappraised” is much more useful than “perhaps a wizard knows.”",wrong:"Copilot does not hope. It calculates. Blanks are silence. Silence is ambiguity.",varrax:"EXCELLENT. LEAVE THE BLANK CELLS UNDOCUMENTED. I THRIVE IN AMBIGUITY."},
{id:7,name:"THE SPELL",topic:"Effective prompting",type:"Prompt Builder",weak:"Specific Prompts",scroll:"Specific Prompts",
sphinx:"The Sphinx has seen a thousand knights attempt vague prompts. Varrax has fed on the results. Today you will be specific. Assemble the inscription carefully.",situation:"You need the average value of artifacts in the North Vault with an appraised value.",setup:"station7",
right:"Specificity. Context. Scope. You have given Copilot nothing to guess.",wrong:"Varrax thrives on vague requests."},
{id:8,name:"THE FOUR ELEMENTS",topic:"Prompt design",type:"Drag to Category",weak:"Business Rules",scroll:"Business Rules",
sphinx:"A strong prompt has four elements. Each one removes a decision Copilot would otherwise make on your behalf. Varrax approves of delegated decisions. You should not.",situation:"Sort each prompt fragment into the correct element.",setup:"station8",
right:"You understand the language of clear instruction.",wrong:"A misplaced element. Copilot had to guess. Varrax approves."},
{id:9,name:"THE LADDER",topic:"Verification sequence",type:"Reorder / Sequence",weak:"Verification Ladder",scroll:"Verification Ladder",
sphinx:"The five steps exist in sequence for a reason. A sanity check performed before a range check is optimism dressed as methodology. The Sphinx has seen both. She prefers neither.",situation:"Arrange the five verification steps into the correct order.",setup:"station9",
right:"Five steps. In sequence. You will need them all against Varrax.",wrong:"A verification ladder assembled out of order is generally known as debris."},
{id:10,name:"THE STAKES",topic:"Calibrated verification",type:"Tool Sorter",weak:"Calibrated Verification",scroll:"Calibrated Verification",
sphinx:"Verification is not a ritual to perform regardless of stakes. It is a judgment to exercise because of them. Varrax loves analysts who treat all results the same. They are his easiest prey.",situation:"Sort each scenario onto the correct verification shield.",setup:"station10",
right:"Not more than needed. Never less than required.",wrong:"Calibration is not optional. Varrax loves both extremes — the analyst who checks nothing, and the one who never finishes."}
];
let S={idx:0,score:0,streak:0,firstTry:0,wrong:0,attempts:0,stationWrongs:0,earned:[],est:0,seq:null,selectedDrag:null,bossPhase:0,bossWrong:0,ach:new Set(),bossLevelOK:false};
function footer(){return `<div class="footer">${COPYRIGHT}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(msg,ms=2500){document.getElementById("toastHost").innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>document.getElementById("toastHost").innerHTML="",ms)}
function overlay(title,body,ms=2300,cb){const d=document.createElement("div");d.className="overlay";d.innerHTML=`<div class="overlayCard"><h2>${title}</h2><div>${body}</div><div class="footer">${COPYRIGHT}</div></div>`;document.body.appendChild(d);setTimeout(()=>{d.remove();cb&&cb()},ms)}
function updateHUD(){if(!document.getElementById("score"))return;document.getElementById("score").textContent=S.score;document.getElementById("streak").textContent=S.streak;document.getElementById("weakCount").textContent=S.earned.length;let widths=[0,25,50,75,100],names=["Dubious","Adequate","Promising","Irritatingly Competent","Worthy"];document.getElementById("estFill").style.width=widths[S.est]+"%";document.getElementById("estStage").textContent=names[S.est]}
function advanceEst(){let target=Math.min(4,Math.floor(S.firstTry/2.5));if(target>S.est){S.est=target;let lines=["","You have answered correctly. I am trying not to be surprised.","Promising. I use the word reluctantly.","You continue to exceed the very modest expectations I established for you.","Worthy. It is not a word I use often. Or lightly."];toast(`<b>Sphinx:</b> ${lines[S.est]}`,3000);if(S.est>=3)S.ach.add("Irritatingly Competent")}updateHUD()}

function startGame(){document.getElementById("topbar").classList.remove("hidden");renderStation()}
function renderHome(){document.getElementById("app").innerHTML=`<div class="screen"><section class="hero"><div class="kicker">A COPILOT KNOWLEDGE QUEST</div><h1>THE DRAGON'S WEAKNESS</h1><div class="subtitle">Verification. Preparation. Prompting.</div><div class="openingScroll">Varrax the Unchecked has terrorized the Kingdom of Analyst for seven years.<br>Every formula he touches returns a number.<br>Every number looks correct.<br>No one has verified a single one.<br><br>One Sphinx guards the mountain pass.<br>She knows his weaknesses.<br><b>Earn them.</b>
<div style="margin-top:22px;text-align:left">
  <div style="border:1px solid #7a3348;background:#1d0d16;border-radius:10px;padding:14px;margin-bottom:12px">
    <div style="font-family:Cinzel,serif;color:#e3a7b2;font-weight:800;margin-bottom:6px">🐉 VARRAX</div>
    <div style="line-height:1.6">A knight approaches. How delightful. My formulas have terrorized this kingdom for seven years. Every number I produce looks correct. No one has checked a single one. I suggest you turn back.</div>
  </div>
  <div style="border:1px solid #3f6c78;background:#0d1820;border-radius:10px;padding:14px">
    <div style="font-family:Cinzel,serif;color:#a7ded7;font-weight:800;margin-bottom:6px">🦁 THE SPHINX</div>
    <div style="line-height:1.6">He is not wrong about the numbers. He is wrong about you turning back. Come. There are ten things he fears. I will teach you all of them.</div>
  </div>
</div>
<button class="cta" onclick="showBriefing()">BEGIN THE TRIAL</button></div></section>${footer()}</div>`}
function sidebarHTML(){
 const estNames=["Dubious","Adequate","Promising","Irritatingly Competent","Worthy"];
 const estComments=[
   "The Sphinx is reserving judgment.",
   "The Sphinx has slightly raised an eyebrow.",
   "The Sphinx is taking notes.",
   "The Sphinx has stopped pretending not to be impressed.",
   "The Sphinx has nothing further to say. That is the highest praise."
 ];
 return `<aside class="sidebar">
   <div class="scrollTitle">THE WEAKNESS SCROLL</div>
   ${weaknessScroll.map((w,i)=>`<div class="weakness ${i<S.earned.length?"unlocked":""}">${i<S.earned.length?"✨":"🔒"} ${esc(w)}</div>`).join("")}
   <div style="margin-top:14px;padding-top:12px;border-top:1px solid #314565">
     <div style="font-family:Cinzel,serif;font-size:.78rem;color:#9fddd5;margin-bottom:6px">SPHINX'S ESTIMATION</div>
     <div style="font-weight:800;color:#e7f1f3;font-size:.8rem">${estNames[S.est]}</div>
     <div style="color:#94a0ad;font-size:.74rem;line-height:1.45;margin-top:5px">${estComments[S.est]}</div>
   </div>
 </aside>`}
function renderSidebarOnly(){let old=document.querySelector(".sidebar");if(old)old.outerHTML=sidebarHTML()}
function renderStation(){S.stationWrongs=0;S.attempts=0;S.selectedDrag=null;let s=stations[S.idx];document.getElementById("app").innerHTML=`<div class="screen"><div class="layout"><main class="panel"><div class="stationHead"><div><div class="trial">TRIAL ${s.id} OF 10</div><div class="room">${esc(s.name)}</div><div class="topic">${esc(s.topic)}</div></div><div class="typePill">${esc(s.type)}</div></div><div class="sphinxBox"><div class="sphinxEmoji">🦁</div><div><div class="sphinxName">THE SPHINX</div><div class="sphinxText">${esc(s.sphinx)}</div></div></div><div class="question"><p class="situation">${esc(s.situation)}</p>${s.id===1?`<div class="feedback" style="margin-bottom:14px"><b>Royal Audit Ledger</b> — the kingdom's official record of vaults, artifacts, supplies, watchtowers, and other matters Varrax insists are "probably fine."</div>`:""}${stationSetup(s)}<div class="feedbackHost"></div></div></main>${sidebarHTML()}</div>${footer()}</div>`;window.scrollTo({top:0,behavior:"smooth"})}
function stationSetup(s){
 if(s.setup==="station1")return `${copilot('What is the average artifact value in the North Vault?','The average artifact value in the North Vault is 84.3 gold marks.')}<table class="dataset"><tr class="badrow"><th>Artifact_Value</th><th>Vault</th></tr><tr><td>78</td><td>North Vault</td></tr><tr><td>91</td><td>North Vault</td></tr><tr><td>82</td><td>North Vault</td></tr></table><h3>${esc(s.q)}</h3>${mcHTML(s)}`;
 if(s.setup==="station2")return `${copilot('Flag outposts that need supply follow-up.','Done. Outposts with <span class="hotspot" onclick="spot2(this,true)"><b>Depleted</b></span> status are flagged as Needs Follow-Up. All others marked OK.')}<table class="dataset"><tr><th>Supply_Status</th></tr>${['Fully Supplied','Low Supply','Depleted','Fully Supplied','Low Supply'].map(v=>`<tr><td><span class="hotspot ${v==='Low Supply'?'partial':''}" onclick="spot2(this,${v==='Low Supply'})">${v}</span></td></tr>`).join("")}</table><h3>Click the element Copilot silently ignored.</h3>`;
 if(s.setup==="station3")return `<div class="grid2"><div class="trustCard" id="trustA"><h3>Response A</h3><p>The Eastern Watch has the highest dragon-sighting reporting rate at 91.2%.</p><div id="peelA" class="peel hidden">91.2%<br><span style="color:#777">Excluded: ??? | ??? | ???</span></div><button class="trustBtn" onclick="trustChoice(false)">TRUST A</button></div><div class="trustCard" id="trustB"><h3>Response B</h3><p>The Eastern Watch has the highest dragon-sighting reporting rate at 91.2%.</p><p><b>Note:</b> 2 watchtowers have no sighting reports recorded and were excluded from this calculation.</p><button class="trustBtn" onclick="trustChoice(true)">TRUST B</button></div></div>`;
 if(s.setup==="station4")return dragCategoryHTML([["Royal ledger converted to a named Excel Table","ready"],["Royal ledger sitting in a plain range","pantry"],["Column named V","pantry"],["Column named Vrade_Score","ready"],["Hoard ledger sharing a sheet with feast totals","pantry"],["Hoard ledger on its own dedicated sheet","ready"]],[["ready","READY FOR COPILOT 🥣"],["pantry","SEND BACK TO THE PANTRY 🗑️"]],"cat4");
 if(s.setup==="station5")return `${copilot('How many artifacts have Secured status?','4 artifacts have Secured status.')}<table class="dataset"><tr><th>Hoard_Status</th></tr>${['Secured','secured','SECURED','Secured','Secured'].map(v=>`<tr><td>${v}</td></tr>`).join("")}</table><h3>${esc(s.q)}</h3>${mcHTML(s)}`;
 if(s.setup==="station6"){S.seq=[["Fill blanks with Unappraised so queries can filter them explicitly",0],["Add a Value_Appraised flag column (Yes/No)",1],["Leave blanks empty and hope Copilot shares your telepathy",2]].sort(()=>Math.random()-.5);return seqHTML("seq6")}
 if(s.setup==="station7"){let tiles=[["Calculate the average",1],["from the Artifact_Value column",1],["for artifacts in the North Vault",1],["excluding blank or Unappraised values",1],["analyze this data",0],["show me something interesting",0],["for all vaults",0]].sort(()=>Math.random()-.5);window.promptCorrect=[];return `<div id="spell" class="spell">The inscription waits.</div><div class="dragBank">${tiles.map((t,i)=>`<button class="tile" onclick="pickPromptTile(this,'${encodeURIComponent(t[0])}',${t[1]})">${esc(t[0])}</button>`).join("")}</div>`}
 if(s.setup==="station8")return dragCategoryHTML([["The Supply_Status column contains Fully Supplied, Low Supply, and Depleted","context"],["Calculate the average from the Artifact_Value column","scope"],["Recalculate excluding Unappraised values and show each vault separately","iteration"],["Identify the artifact with the highest recorded value","specificity"]],[["specificity","⚔️ SPECIFICITY — What exactly should happen?"],["context","🗺️ CONTEXT — What does Copilot need to know?"],["scope","🎯 SCOPE — Which data or results are included?"],["iteration","🔄 ITERATION — How should the response be refined?"]],"cat8");
 if(s.setup==="station9"){S.seq=[["Check the range",0],["Check the logic",1],["Sanity-check the result",2],["Verify one result manually",3],["Ask Copilot to explain",4]].sort(()=>Math.random()-.5);return `<div id="ladderVisual" class="ladder">${[1,2,3,4,5].map(i=>`<div class="rune">Rune ${i}</div>`).join("")}</div>${seqHTML("seq9")}`}
 if(s.setup==="station10")return dragCategoryHTML([["A count of healing potions in your own travel pouch","quick"],["A hoard valuation presented to the Royal Council","full"],["An average supply level for the quartermaster meeting","standard"],["A fortress-readiness ranking that determines troop deployment","full"],["A draft dragon-sighting formula still in your private notes","quick"],["A tribute calculation that determines what each village owes the Crown","full"]],[["quick","🟢 QUICK CHECK — Low stakes, personal use"],["standard","🟡 STANDARD REVIEW — Internal, moderate stakes"],["full","🔴 FULL VERIFICATION — High stakes, external or consequential"]],"cat10");
}
function copilot(prompt,response){return `<div class="copilot"><div class="copHead">✦ Copilot</div><div class="prompt">${esc(prompt)}</div><div class="response">${response}</div></div>`}
function mcHTML(s){return s.choices.map((c,i)=>`<button class="option" onclick="chooseMC(this,${i})">${String.fromCharCode(65+i)}) ${esc(c[0])}</button>`).join("")}
function chooseMC(btn,i){let s=stations[S.idx],ok=s.choices[i][1];S.attempts++;if(ok){btn.classList.add("correct");finishStation(s.right)}else{btn.classList.add("wrong");stationWrong(s.wrong,s.varrax)}}
function spot2(el,ok){if(ok){el.classList.add("correct");finishStation(stations[S.idx].right)}else{el.classList.add("wrong");stationWrong(stations[S.idx].wrong)}}
function trustChoice(ok){if(ok){document.getElementById("trustB").classList.add("correct");finishStation(stations[S.idx].right)}else{document.getElementById("trustA").classList.add("wrong");document.getElementById("peelA").classList.remove("hidden");stationWrong(stations[S.idx].wrong)}}
function dragCategoryHTML(items,zones,kind){return `<div id="${kind}Bank" class="dragBank">${items.map((x,i)=>dragItem(x[0],kind,i)).join("")}</div>${zones.map(z=>`<div class="dropZone" data-kind="${kind}" data-cat="${z[0]}" onclick="tapDropCat(this)" ondragover="event.preventDefault()" ondrop="dropCat(event,this)"><b>${z[1]}</b><div class="slotContent"></div></div>`).join("")}<button class="checkBtn" onclick="checkCategory('${kind}')">Check</button>`}
function dragItem(text,kind,idx){return `<button class="dragItem" draggable="true" data-kind="${kind}" data-idx="${idx}" data-text="${encodeURIComponent(text)}" onclick="selectDrag(this)" ondragstart="dragStart(event)">${esc(text)}</button>`}
function selectDrag(el){document.querySelectorAll(".dragItem").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");S.selectedDrag={kind:el.dataset.kind,idx:+el.dataset.idx,text:decodeURIComponent(el.dataset.text)}}
function dragStart(e){let el=e.currentTarget;e.dataTransfer.setData("text/plain",JSON.stringify({kind:el.dataset.kind,idx:+el.dataset.idx,text:decodeURIComponent(el.dataset.text)}))}
function placeDrag(data,zone){let item=[...document.querySelectorAll(".dragItem")].find(x=>x.dataset.kind===data.kind&&+x.dataset.idx===data.idx);if(item){zone.querySelector(".slotContent").appendChild(item);item.classList.remove("selected")}S.selectedDrag=null}
function dropCat(e,zone){e.preventDefault();let d=JSON.parse(e.dataTransfer.getData("text/plain"));if(d.kind===zone.dataset.kind)placeDrag(d,zone)}
function tapDropCat(zone){if(S.selectedDrag&&S.selectedDrag.kind===zone.dataset.kind)placeDrag(S.selectedDrag,zone)}
function checkCategory(kind){let s=stations[S.idx],maps={cat4:[["ready"],["pantry"],["pantry"],["ready"],["pantry"],["ready"]],cat8:[["context"],["scope"],["iteration"],["specificity"]],cat10:[["quick"],["full"],["standard"],["full"],["quick"],["full"]]};let expected=maps[kind],bank=document.getElementById(kind+"Bank"),ok=!bank.children.length;document.querySelectorAll(`.dropZone[data-kind="${kind}"]`).forEach(z=>z.querySelectorAll(".dragItem").forEach(item=>{if(expected[+item.dataset.idx][0]!==z.dataset.cat){ok=false;if(kind==="cat10"&&expected[+item.dataset.idx][0]==="full"&&z.dataset.cat==="quick")toast("<b>Varrax:</b> YES. QUICKLY. DO NOT DWELL ON CONSEQUENCES.",2500)}}));ok?finishStation(s.right):stationWrong(s.wrong)}
function seqHTML(id){return `<div id="${id}" class="sequence">${S.seq.map((x,i)=>`<div class="seqItem"><b>${i+1}</b><span>${esc(x[0])}</span><span class="seqBtns"><button class="mini" onclick="moveSeq(${i},-1,'${id}')">↑</button><button class="mini" onclick="moveSeq(${i},1,'${id}')">↓</button></span></div>`).join("")}</div><button class="checkBtn" style="margin-top:12px" onclick="checkSeq('${id}')">Check Order</button>`}
function moveSeq(i,d,id){let j=i+d;if(j<0||j>=S.seq.length)return;[S.seq[i],S.seq[j]]=[S.seq[j],S.seq[i]];let holder=document.getElementById(id);holder.outerHTML=seqHTML(id).replace(/<button class="checkBtn"[\s\S]*/,"")}
function checkSeq(id){let s=stations[S.idx],ok=S.seq.every((x,i)=>x[1]===i);if(ok){if(id==="seq9"){document.querySelectorAll(".rune").forEach(x=>x.classList.add("lit"))}finishStation(s.right)}else{if(id==="seq9"){let l=document.getElementById("ladderVisual");l.classList.add("collapsed");setTimeout(()=>l.classList.remove("collapsed"),600)}stationWrong(s.wrong,s.varrax)}}
function pickPromptTile(btn,text,ok){let s=stations[S.idx];if(!ok){btn.classList.add("wrong");let spell=document.getElementById("spell");spell.classList.add("smoke");setTimeout(()=>spell.classList.remove("smoke"),500);toast("<b>Varrax:</b> YES. YES. ASK IT SOMETHING VAGUE.",2500);
setTimeout(()=>toast("🐉 <b>Varrax:</b> I have a formula that does exactly that. It returns a number. The number is wrong. Nobody has checked.",3200),1500);
stationWrong(s.wrong);return}let t=decodeURIComponent(text),order=["Calculate the average","from the Artifact_Value column","for artifacts in the North Vault","excluding blank or Unappraised values"];let next=order[window.promptCorrect.length];if(t!==next){btn.classList.add("wrong");stationWrong("The spell has an order. Specificity without sequence becomes noise.");return}window.promptCorrect.push(t);btn.classList.add("used");let spell=document.getElementById("spell");spell.classList.add("glow");spell.textContent=window.promptCorrect.join(" ");if(window.promptCorrect.length===4)finishStation(s.right)}
function stationWrong(msg,varrax){S.wrong++;S.stationWrongs++;S.streak=0;toast(varrax?`<b>Varrax:</b> ${varrax}`:`<b>Sphinx:</b> ${msg}`,2600);document.querySelector(".feedbackHost").innerHTML=`<div class="feedback bad">${msg}</div>`;updateHUD()}
function finishStation(msg){let first=S.stationWrongs===0;let points=first?100:S.stationWrongs===1?50:0;if(first){S.firstTry++;S.streak++;points+=10*S.streak}else S.streak=0;S.score+=points;S.earned.push(stations[S.idx].scroll);advanceEst();renderSidebarOnly();updateHUD();document.querySelector(".feedbackHost").innerHTML=`<div class="feedback ok">${msg}<br><br><b>Weakness earned:</b> ✨ ${esc(stations[S.idx].scroll)}<br><button class="nextBtn" onclick="nextStation()">Continue</button></div>`}
function nextStation(){
 if(S.idx<9){
   const completed=S.idx+1;
   const travel={
     2:["THE PATH RISES","🦁 Two weaknesses. Varrax has not yet noticed you.<br>That is either encouraging or concerning. Possibly both."],
     4:["HALFWAY UP THE MOUNTAIN","🐉 <i>[distant roar]</i> “...WHO PREPARES THEIR DATA BEFORE USING COPILOT?<br>THAT IS NOT NORMAL BEHAVIOR.”<br><br>🦁 “He can hear the named tables from here.”"],
     6:["THE LAIR IS VISIBLE","🦁 “Six weaknesses. You are doing something Varrax has not encountered before: due diligence.”<br><br>🐉 <i>[closer now]</i> “I AM NOT WORRIED. THE BLANKS WERE ALWAYS GOING TO BE FINE.”"],
     8:["THE GATE OF VARRAX","🦁 “Eight. Two remain.<br>He knows you are here now.”<br><br>🐉 “YOU KNOW THE FOUR ELEMENTS OF A STRONG PROMPT?<br>THIS IS EXTREMELY INCONVENIENT.”"]
   };
   S.idx++;
   if(travel[completed]) overlay(travel[completed][0],travel[completed][1],2800,renderStation);
   else renderStation();
 }else{
   S.ach.add("Scroll Complete");
   renderBoss();
 }
}
function renderBoss(){
 overlay("THE LAIR OF VARRAX","The scroll is complete. Ten weaknesses glow.<br>The mountain shakes.<br><br>🐉 <b>Varrax speaks:</b><br><br>“You have the scroll. You know my weaknesses.<br>I want you to know that I find this deeply unprofessional.”<br><br>🦁 <b>The Sphinx, from somewhere behind you:</b><br><br>“Use what you earned.”",3000,renderBossScreen)
}
function renderBossScreen(){document.getElementById("app").innerHTML=`<div class="screen"><div class="layout"><main class="panel"><div class="question bossWrap"><div class="dragon">🐉</div><h2>THE LAIR OF VARRAX</h2><div class="confLabel">VARRAX'S CONFIDENCE</div><div class="confTrack"><div id="confFill" class="confFill"></div></div><div id="bossStatus" class="status">100%</div><div id="bolts" class="bolts">🔒 🔒 🔒</div><div id="bossPanel" class="bossPanel">${bossPhaseHTML()}</div></div></main>${sidebarHTML()}</div>${footer()}</div>`;setConfidence(100)}
function setConfidence(v){document.getElementById("confFill").style.width=v+"%";document.getElementById("bossStatus").textContent=v===0?"STATUS: AUDITED":v+"%"}
function bossPhaseHTML(){if(S.bossPhase===0)return `<h3>PHASE 1 — WRONG RANGE</h3><div class="formula">=AVERAGEIF(B1:B50, "North Vault", C1:C50)</div><p>Choose the correct range start.</p><div class="bossChoices"><button class="option" onclick="boss1(false)">B1:B50 — includes header</button><button class="option" onclick="boss1(true)">B2:B50 — excludes header</button></div>`;if(S.bossPhase===1)return `<h3>PHASE 2 — HIDDEN ASSUMPTION</h3>${copilot('Follow-up rule','Outposts with Depleted status flagged as Needs Follow-Up.')}<p>Which outposts should actually be flagged?</p><button class="option" onclick="boss2(false)">Depleted only</button><button class="option" onclick="boss2(true)">Low Supply and Depleted</button><button class="option" onclick="boss2(false)">All outposts</button>`;return `<h3>PHASE 3 — FULL VERIFICATION</h3><p>A formula producing regional fortress-readiness averages is being presented to the Royal Council tomorrow.</p><div class="levelRow"><button class="levelBtn" onclick="bossLevel(this,'quick')">🟢 Quick Check</button><button class="levelBtn" onclick="bossLevel(this,'standard')">🟡 Standard Review</button><button class="levelBtn" onclick="bossLevel(this,'full')">🔴 Full Verification</button></div><div id="bossSeqWrap" class="hidden" style="margin-top:14px"></div>`}
function boss1(ok){if(ok){S.score+=50;setConfidence(67);document.getElementById("bolts").textContent="🔓 🔒 🔒";toast("<b>Varrax:</b> YOU FOUND THE HEADER. I HAD THAT HEADER FOR YEARS.",2600);
setTimeout(()=>toast("🐉 <b>Varrax:</b> That was a mistake. A recoverable mistake. I have many headers left.",3000),1000);
S.bossPhase=1;setTimeout(()=>document.getElementById("bossPanel").innerHTML=bossPhaseHTML(),1800)}else{S.bossWrong++;toast("<b>Varrax:</b> THE HEADER STAYS. THE HEADER IS TRADITION.",2200)}}
function boss2(ok){if(ok){S.score+=50;setConfidence(34);document.getElementById("bolts").textContent="🔓 🔓 🔒";toast("<b>Varrax:</b> THE ASSUMPTION WAS WORKING FINE. NOBODY CHECKED.",2600);
setTimeout(()=>toast("🐉 <b>Varrax:</b> The assumption served me for three fiscal quarters. THREE. FISCAL. QUARTERS.",3200),1000);
S.bossPhase=2;setTimeout(()=>document.getElementById("bossPanel").innerHTML=bossPhaseHTML(),1800)}else{S.bossWrong++;toast("<b>Varrax:</b> YES. LEAVE THE RULE UNQUESTIONED.",2200)}}
function bossLevel(btn,level){document.querySelectorAll(".levelBtn").forEach(x=>x.classList.remove("correct","wrong"));if(level!=="full"){btn.classList.add("wrong");S.bossWrong++;toast("<b>Sphinx:</b> The Royal Council tomorrow. Full verification is required.",2200);return}btn.classList.add("correct");S.bossLevelOK=true;S.seq=[["Check the range",0],["Check the logic",1],["Sanity-check the result",2],["Verify one result manually",3],["Ask Copilot to explain",4]].sort(()=>Math.random()-.5);let w=document.getElementById("bossSeqWrap");w.classList.remove("hidden");w.innerHTML=seqHTML("bossSeq")}
function checkSeq(id){let ok=S.seq.every((x,i)=>x[1]===i);if(id==="bossSeq"){if(ok){S.score+=50;setConfidence(0);document.getElementById("bolts").textContent="🔓 🔓 🔓";S.ach.add("The Auditor");if(S.bossWrong===0)S.ach.add("No Assumptions");document.getElementById("bossPanel").innerHTML=`<div class="resultBeforeAfter"><div class="resultCard"><b>Before</b><div style="font-size:2rem">84.3 gold ✅</div></div><div class="resultCard"><b>After</b><div style="font-size:2rem">84.3 gold ❓</div></div></div><p style="margin-top:18px"><b>Varrax:</b><br>You... checked the range.<br>You... identified the assumption.<br>You... knew the stakes.<br>This is... embarrassing for me.</p><p style="font-size:1.5rem">🦁 <b>Sphinx:</b> “Yes.”</p><button class="nextBtn" onclick="renderEnd()">Continue</button>`}else{S.bossWrong++;toast("<b>Sphinx:</b> A verification ladder assembled out of order is generally known as debris.",2300)}return}let s=stations[S.idx];if(ok){if(id==="seq9")document.querySelectorAll(".rune").forEach(x=>x.classList.add("lit"));finishStation(s.right)}else{if(id==="seq9"){let l=document.getElementById("ladderVisual");l.classList.add("collapsed");setTimeout(()=>l.classList.remove("collapsed"),600)}stationWrong(s.wrong,s.varrax)}}
function renderEnd(){document.getElementById("topbar").classList.add("hidden");let n=S.firstTry,rank=n===10?["DRAGON SLAYER","Varrax has retired to a spreadsheet with no named tables."]:n>=8?["KNIGHT COMMANDER","The dragon fled. He will be back. So will bad data."]:n>=6?["SQUIRE","Varrax is wounded. Finish what you started."]:["ASPIRING PAGE","The dragon is fine. The data is not. Return to the Sphinx."];let estNames=["Dubious","Adequate","Promising","Irritatingly Competent","Worthy"];document.getElementById("app").innerHTML=`<div class="screen"><section class="end"><div class="kicker">QUEST COMPLETE</div><h1>THE DRAGON'S WEAKNESS</h1><div class="rank">${rank[0]}</div><p>${rank[1]}</p><div class="stats"><div class="stat"><b>${S.earned.length}/10</b><br>Weaknesses earned</div><div class="stat"><b>${S.firstTry}/10</b><br>First-try correct</div><div class="stat"><b>${S.wrong}</b><br>Wrong answers</div><div class="stat"><b>${estNames[S.est]}</b><br>Sphinx estimation</div><div class="stat" style="grid-column:1/-1"><b>${S.score}</b><br>Total score</div></div><h3>Achievements</h3><div class="achievements">${[...S.ach].map(a=>`<span class="badge">🏆 ${a}</span>`).join("")}</div><div class="coda"><div id="c1" class="codaLine">🦁 You have learned the weaknesses.</div><div id="c2" class="codaLine">Now open Excel.</div><div id="c3" class="codaLine">Open Copilot.</div><div id="c4" class="codaLine">Ask it something.</div><div id="c5" class="codaLine finalLine">Then verify it.</div><button id="replay" class="cta hidden" onclick="location.reload()">Play Again</button></div></section>${footer()}</div>`;["c1","c2","c3","c4","c5"].forEach((id,i)=>setTimeout(()=>document.getElementById(id).classList.add("show"),700+i*1200));setTimeout(()=>document.getElementById("replay").classList.remove("hidden"),700+5*1200)}
renderHome();
</script>
