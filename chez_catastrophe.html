function renderHome(){showTop(false);app.innerHTML=`<div class="screen"><section class="hero"><div class="kicker">CHEZ CATASTROPHE</div><h1>An Excel Escape Room.</h1><div class="tag">In a Restaurant. On Fire.</div><div class="card intro">You are a new data analyst trapped inside the world's most chaotic fine-dining restaurant. Chef Maxime locked every door. The health inspector arrives in <b>45 minutes</b>. Thirteen Excel stations stand between you and freedom.<br><button class="cta" onclick="characters()">ENTER CHEZ CATASTROPHE 🔥</button></div></section>${footer()}</div>`}function characters(){app.innerHTML=`<div class="screen"><section class="hero"><div class="kicker">THE PEOPLE INVOLVED</div><h2>Meet Chez Catastrophe</h2></section><div class="cards"><article class="card character"><div class="icon">👨‍🍳</div><h2>Chef Maxime Beaudesastre</h2><p>The head chef and owner of Chez Catastrophe. He locked every door. He will not unlock them until the restaurant data is clean and the dashboard is ready for the health inspector.</p></article><article class="card character"><div class="icon">📋</div><h2>The Health Inspector</h2><p>An inspector from the city health authority. Arriving in 45 minutes. Has never given a perfect score. Is not known for patience.</p></article></div><div style="text-align:center"><button class="cta" onclick="howTo()">Meet the Kitchen →</button></div>${footer()}</div>`}function howTo(){let mechanics=[['Multiple Choice','Click one answer.'],['Build the Formula','Click tokens in order, then check.'],['Fix the Bug','Click the broken formula part.'],['Rapid Fire True/False','Answer all, then submit.'],['Click the Cell','Click the correct spreadsheet cell.'],['Spot the Difference','Choose the correctly built option.'],['Put in Order','Use arrows, then check.'],['Match the Pairs','Tap an item, then its target; tap a placed item to return it.'],['Fill in the Blank','Type the missing value.'],['Drag and Drop','Tap an item, then a zone; all items must be corr function inspectorFilter(){let k=S.keys.length;if(k>=12)return'grayscale(.7) brightness(.6)';if(k>=10)return'grayscale(.4) brightness(.8) hue-rotate(160deg)';if(k>=8)return'grayscale(.2) brightness(.95)';if(k>=6)return'hue-rotate(90deg) brightness(1)';if(k>=4)return'drop-shadow(0 0 8px #9d7924)';return'drop-shadow(0 0 18px #d09b22) brightness(1.1)'}function side(){let pct=Math.min(100,S.wrong/13*100),label=pct<=25?'🟢 QUESTIONABLE':pct<=50?'🟡 DISASTER IN PROGRESS':pct<=75?'🟠 CATASTROPHE':'🔴 HEALTH INSPECTOR HAS BEEN CALLED';return `<aside class="sidebar"><div class="sideTitle">Restaurant Map</div>${rooms.map((r,i)=>`<div class="mapNode ${i<S.i?'solved':i===S.i?'current':''}">${i<S.i?'✅':i===S.i?'◉':'🔒'} ${i+1}. ${r}</div>`).join('')}<div class="sideTitle" style="margin-top:14px">Key Inventory</div><div class="keys">${keys.map((k,i)=>`<span class="key ${i<S.keys.length?'earned':''}" title="${i<S.keys.length?keys[i]:'Locked'}">🗝️</span>`).join('')}</div><div class="sideTitle" style="margin-top:14px">Catastrophe Meter</div><small>KITCHEN STATUS — rises with each wrong answer</small><div class="meterWrap"><div class="meter" style="width:${pct}%"></div></div><small>${label}</small><div class="inspector"><div class="sideTitle">Health Inspector</div><div class="inspectorIcon" style="filter:${inspectorFilter()}">📋</div></div><details class="datasetSide"><summary>Dataset Reference</summary>${datasetHTML(false)}</details></aside>`}

function body(){let i=S.i,x=t[i];if(i===0||i===6)return x.opts.map((o,j)=>`<button class="option" data-good="${j===x.ans}" onclick="mc(this,${j})">${String.fromCharCode(65+j)}) ${o}</button>`).join('');if(i===1){let ts=['=','SUM','(','SalesLog','[','Revenue',']',')'].sort(()=>Math.random()-.5);return `<div id="formula" class="formula"></div><div class="bank">${ts.map(z=>`<button class="token" onclick="tok(this,'${encodeURIComponent(z)}')">${z}</button>`).join('')}</div><button class="mini" onclick="undo()">Undo</button> <button class="check" onclick="checkFormula()">Check Formula</button>`}if(i===2)return `<div class="formula">${['=IF(','[@ProfitMargin]','>0, ','Profitable',', ','Loss',')'].map((z,j)=>`<span class="${[1,3,5].includes(j)?'clickPart':''}" data-good="${j===3||j===5}" onclick="bug(this,${j})">${esc(z)}</span>`).join('')}</div>`;if(i===3){window.tf={};let qs=[['A slicer inserted from a Table filters only that Table by default.',true,'True. Connections to other Tables must be configured.'],['The X icon clears all slicer selections.',true,'True. All rows become visible again.'],['A Timeline works on text columns like Server.',false,'False. Timeline requires a date column.']];window.qs=qs;return qs.map((q,j)=>`<div class="feedback"><b>${q[0]}</b><div class="tfrow"><button class="tfbtn" onclick="tfPick(this,${j},true)">TRUE</button><button class="tfbtn" onclick="tfPick(this,${j},false)">FALSE</button></div><small id="tf${j}"></small></div>`).join('')+`<button class="check" onclick="tfCheck()">Unlock</button>`}if(i===4)return `<div class="tableWrap"><table class="excel"><tr><th>Metric</th><th>Formula</th><th>Value</th></tr><tr><td>Total Revenue (SUM)</td><td><button class="option" onclick="cell(this,false)">=SUM(SalesLog[Revenue])</button></td><td>$94,940</td></tr><tr><td>Total Revenue (SUBTOTAL)</td><td><button class="option" data-good="true" onclick="cell(this,true)">=SUBTOTAL(9,SalesLog[Revenue])</button></td><td>$25,560</td></tr></table></div>`;if(i===5)return `<div class="models"><button class="model" onclick="model(this,false)"><h3>KPI Card A</h3><p>=SUM(SalesLog[Revenue])</p><b>$94,940</b><p>When filtered: still $94,940</p></button><button class="model" data-good="true" onclick="model(this,true)"><h3>KPI Card B</h3><p>=SUBTOTAL(9,SalesLog[Revenue])</p><b>$25,560</b><p>When filtered: updates</p></button></div>`;if(i===7){S.seq=['Remove chart border','Delete the legend','Add direct label on Covers line','Change Revenue bars to teal','Remove gridlines'].map((z,j)=>({z,j})).sort(()=>Math.random()-.5);return `<div id="seqList" class="sequence">${seqItems()}</div><button class="check" onclick="checkSeq()">Check Order</button>`}if(i===8){let pairs=[['SUM','Total revenue across all days'],['COUNT','Number of service shifts'],['AVERAGE','Mean covers per shift'],['% of Grand Total',"Each server's share of total revenue"],['Running Total In','Cumulative revenue building day by day'],['Rank Largest to Smallest','Server ranking by revenue']];window.pairs=pairs;return dragUI('match',pairs.map(x=>x[0]),pairs.map((x,j)=>[String(j),x[1]]),'Check Matches') }if(i===9)return `<div class="formula">= Revenue * (1 - <input id="fill" class="small" placeholder="field name"> )</div><p>Hint: use the field name exactly as it appears in SalesLog.</p><button class="check" onclick="fillCheck()">Check Formula</button>`;if(i===10){window.valItems=[['Duplicate ReservationID entered','stop'],['Guest name left blank','stop'],['ReservationDate in the past','stop'],['Party size above 12','warning'],['Revenue per cover below average','warning'],['Reservation made less than 2 hours before service','info']];return dragUI('valid',window.valItems.map(x=>x[0]),[['stop','🚫 Stop'],['warning','⚠️ Warning'],['info','ℹ️ Information']],'Check Rules')}if(i===11)return `<div class="grid2"><button class="version" onclick="version(this,false)"><h3>Version A</h3><div class="formula">='Calculations'!B8</div><p>Direct reference. The cell at B8 will be deleted.</p><div function dragUI(kind,items,zones,label){return `<div id="${kind}Bank" class="bank">${items.map((z,j)=>drag(z,kind,j)).join('')}</div>${zones.map(z=>`<div class="drop" data-kind="${kind}" data-cat="${z[0]}" onclick="dropTap(this)"><b>${z[1]}</b><div class="slot"></div></div>`).join('')}<button class="check" onclick="checkDrag('${kind}')">${label}</button>`}function drag(z,k,j){return `<button class="dragItem" data-kind="${k}" data-i="${j}" onclick="select(this)">${z}</button>`}function select(el){if(el.closest('.drop')){document.getElementById(el.dataset.kind+'Bank').appendChild(el);el.classList.remove('selected');S.selected=null;document.body.classList.remove('placing');return}document.querySelectorAll('.dragItem').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');S.selected=el;document.body.classList.add('placing')}function dropTap(z){if(!S.selected||S.selected.dataset.kind!==z.dataset.kind)return;if(z.dataset.kind==='match'){let prior=z.querySelector('.dragItem');if(prior)document.getElementById('matchBank').appendChild(prior)}z.querySelector('.slot').appendChild(S.selected);S.selected.classList.remove('selected');S.selected=null;document.body.classList.remove('placing')}
function attempt(ans,ok,why){clearIdle();if(!S.answers[S.i])S.answers[S.i]={answer:ans,first:ok,feedback:t[S.i].right};else S.answers[S.i].answer=ans;if(ok)return complete();S.attempt=true;S.wrong++;S.strikes--;S.streak=0;S.wrongBy[S.i]=(S.wrongBy[S.i]||0)+1;sound('wrong');document.querySelectorAll('.knife').forEach((x,j)=>x.classList.toggle('lost',j>=S.strikes));let milestones={3:'THREE CATASTROPHES. We are no longer a restaurant. We are an INCIDENT.',5:'FIVE. I called my mother. She is disappointed in both of us.',8:'The health inspector has a name for us now. It is not flattering.',10:'I have never failed a health inspection. Until you.'};if(milestones[S.wrong])toast(`<b>Chef:</b> ${milestones[S.wrong]}`,3300);if(S.wrongBy[S.i]===3)S.ach.add('Absolute Ratatouille');if(S.strikes===0)return reveal();fb.innerHTML=`<div class="feedback bad">${why}</div>`;setupIdle()}
function reveal(){document.querySelectorAll('[data-good="true"]').forEach(x=>x.classList.add('correct'));document.querySelectorAll('.option,.check,.token,.dragItem,.version,.model,.tfbtn').forEach(x=>x.classList.add('disabled'));toast('📋 The inspector notes this in their report.');complete(true)}function complete(forced=false){S.active=false;clearIdle();if(!S.attempt&&!forced){S.first++;S.streak++;S.longest=Math.max(S.longest,S.streak)}S.keys.push(keys[S.i]);if(!S.answers[S.i])S.answers[S.i]={answer:forced?'Correct answer revealed':'Correct',first:!forced&&!S.attempt,feedback:t[S.i].right};if(S.i===2)S.ach.add('No More #REF!');if(S.i===3)S.ach.add('Son of a Slicer');if(S.i===8)S.ach.add('The Pivot Thickens');if(S.i===8&&!S.attempt)S.ach.add('The Sommelier Approves');if(S.i===2&&S.first===3)S.ach.add('Mise en Place');if(S.streak>=8)S.ach.add('Pivot Warlord');sound('ok');setTimeout(()=>sound('key'),180);hud();fb.innerHTML=`<div class="feedback ok">${t[S.i].right}<br><b>Key earned: 🗝️ ${keys[S.i]}</b><br><button class="next" onclick="nextStation()">Continue</button></div>`;let sb=document.querySelector('.sidebar');if(sb)sb.outerHTML=side()}
function mc(b,j){let x=t[S.i];b.classList.add(j===x.ans?'correct':'wrong');attempt(x.opts[j],j===x.ans,x.wrong[j])}function tok(b,z){S.build.push(decodeURIComponent(z));b.classList.add('used');formula.textContent=S.build.join('')}function undo(){S.build.pop();formula.textContent=S.build.join('');document.querySelectorAll('.token').forEach(x=>x.classList.remove('used'));let tmp=[...S.build];document.querySelectorAll('.token').forEach(x=>{let z=x.textContent,j=tmp.indexOf(z);if(j>=0){x.classList.add('used');tmp.splice(j,1)}})}function checkFormula(){attempt(S.build.join(''),S.build.join('')==='=SUM(SalesLog[Revenue])','Structured syntax is TableName[ColumnName]. Check the token order.')}function bug(b,j){let ok=j===3||j===5;b.classList.add(ok?'correct':'wrong');attempt(b.textContent,ok,'The comparison is correct. Text returned by IF must be wrapped in double quotes.')}function tfPick(b,j,v){window.tf[j]=v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tf'+j).textContent=window.qs[j][2]}function tfCheck(){if(Object.keys(window.tf).length<3)return toast('Answer all three locks.');let ok=window.qs.every((q,j)=>window.tf[j]===q[1]);attempt('True/False set',ok,'Review the explanations below each statement and reconsider the rule that does not match.')}function cell(b,ok){b.classList.add(ok?'correct':'wrong');attempt(b.textContent,ok,'SUM ignores filters and includes weekdays. SUBTOTAL with code 9 uses only visible rows.')}function model(b,ok){b.classList.add(ok?'correct':'wrong');attempt(b.querySelector('h3').textContent,ok,'A dashboard KPI must respond to filters. SUM always returns the full dataset total; SUBTOTAL recalculates visible rows.')}function seqItems(){return S.seq.map((x,j)=>`<div class="seq"><b>${j+1}</b><span>${x.z}</span><span><button class="mini" onclick="move(${j},-1)">↑</button><button class="mini" onclick="move(${j},1)">↓</button></span></div>`).join('')}function mov function boss(){if(S.boss===0)return `<div class="bossBolts"><span id="bolt0">🔒</span> <span id="bolt1">🔒</span> <span id="bolt2">🔒</span></div><div id="bossStage"><h3>BOLT 1 — Find the Target</h3><div class="slider"><div class="count">$<span id="sv">142</span></div><input id="sl" type="range" min="100" max="300" value="142" oninput="slide(this.value)"><p>Projected Revenue: $<b id="proj">14,200</b></p><p id="sr">Chef is staring at the slider.</p></div><button class="check" onclick="bolt1()">Set Target</button></div>`;return''}function slide(v){sv.textContent=v;proj.textContent=(v*100).toLocaleString();sr.textContent=v<=160?'Non. We cannot afford the butter.':v<=185?'Closer. The soufflé is unimpressed.':v<200?'DO NOT STOP NOW. THE DOOR IS LISTENING.':v==200?'MON DIEU. $200. THE BOLT IS MOVING.':'You have gone too far. As with everything.'}function bolt1(){if(+sl.value!==200)return attempt('$'+sl.value,false,'Divide $20,000 by 100 seatings. The slider must reach exactly that average.');openBolt()}function openBolt(){document.getElementById('bolt'+S.boss).textContent='🔓';sound('key');S.boss++;setTimeout(()=>{if(S.boss===1)bossStage.innerHTML=`<h3>BOLT 2 — Name the Tool</h3>${['VLOOKUP','Goal Seek','Scenario Manager','Data Tables'].map((z,j)=>`<button class="option" onclick="bolt2(this,${j})">${z}</button>`).join('')}`;else if(S.boss===2)bossStage.innerHTML=`<h3>BOLT 3 — Configure Goal Seek</h3>${dragUI('goal',['Total Monthly Revenue cell','$20,000','Average Revenue per Seating cell'],[['0','Set cell'],['1','To value'],['2','By changing cell']],'OPEN FINAL BOLT')}`;else finale()},600)}function bolt2(b,j){if(j===1){b.classList.add('correct');openBolt()}else attempt(b.textContent,false,j===0?'VLOOKUP finds a matching value; it cannot calculate backward from a target.':j===2?'Scenario Manager tests combinations defined in advance. Goal Seek finds one required input.':'Data Tables generate many outputs. Goal Seek finds one input from a desired output.')}const oldCheck=check function clearIdle(){idles.forEach(clearTimeout);idles=[];idle.innerHTML=''}function setupIdle(){clearIdle();[[10,'Hmm.'],[20,'You are thinking very loudly.'],[30,'Should I call Microsoft?'],[45,'I HAVE AGED. Visibly. Because of you.'],[60,'The inspector is outside. THE INSPECTOR IS OUTSIDE.']].forEach(([s,m])=>idles.push(setTimeout(()=>{if(S.active)idle.innerHTML=`<div class="idle">👨‍🍳 <b>Chef:</b><br>${m}</div>`},s*1000)))}function beat(title,text,cb,ms=2800){S.active=false;let m=document.createElement('div');m.className='modal overlay';m.innerHTML=`<div class="modalCard"><h2>${title}</h2><p>${text}</p></div>`;document.body.appendChild(m);setTimeout(()=>{m.remove();cb()},ms)}

function finale(){S.keys.push('$200');S.ach.add('Brunch Survivor');if(S.wrong===0)S.ach.add("Chef's Kiss");sound('final');beat('EXIT UNLOCKED','🔓 🔓 🔓<br>The door opens. The health inspector appears.<br><b>Chef:</b> “…That is unfortunate.”<br>All 13 keys strike the locks. Confetti. One dignified tear. ⭐',renderEnd,4200)}function renderEnd(){clearInterval(S.timer);showTop(false);let hi=S.first>=11,mid=S.first>=7,rank=hi?'👨‍🍳 EXECUTIVE CHEF':mid?'🎖️ SOUS CHEF':'🍽️ DISHWASHER',chef=hi?'Perfect. Flawless. I have retired. You are the restaurant now.':mid?'Strong work. Chez Catastrophe has its first Michelin star. I credit you. Quietly.':'You survived. The restaurant survived. Barely.',insp=hi?'The inspector gave us five stars and left quickly.':mid?'The inspector gave us a conditional pass and some notes.':'The inspector is writing a very long report.';app.innerHTML=`<div class="screen"><section class="end"><div class="kicker">YOU ESCAPED CHEZ CATASTROPHE</div><h1>Freedom.</h1><div class="rank">${rank}</div><p><b>Chef:</b> ${chef}<br><b>Inspector:</b> ${insp}</p><div class="stats"><div class="stat"><b>13/13</b><br>Stations</div><div class="stat"><b>${S.first}/13</b><br>First try</div><div class="stat"><b>${fmt(S.time)}</b><br>Remaining</div><div class="stat"><b>${S.wrong}</b><br>Catastrophes</div><div class="stat"><b>${S.longest}</b><br>Longest combo</div></div><div class="badges">${[...S.ach].map(x=>`<span class="badge">🏆 ${x}</span>`).join('')}</div><section class="review"><h2>Trial Review</h2>${t.map((x,i)=>{let a=S.answers[i]||{answer:'Revealed',first:false};return `<article class="reviewCard ${a.first?'':'missed'}"><button class="reviewHead" onclick="this.nextElementSibling.classList.toggle('hidden')"><b>${i+1}. ${rooms[i]}</b> — ${a.first?'First-try correct':'Review recommended'}</button><div class="reviewBody hidden"><p><b>Task:</b> ${x.task}</p><p><b>Your answer:</b> ${esc(a.answer)}</p><p><b>Correct principle:</b> ${x.right}</p></div></article>`}).join('')}</sect
