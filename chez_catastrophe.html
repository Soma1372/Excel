<style>

.tag{font-size:clamp(1.05rem,2vw,1.45rem);color:#cfc0a7}.introCard{margin:28px auto 0;max-width:720px;border:1px solid #5a3512;background:linear-gradient(135deg,rgba(139,69,19,.18),rgba(204,34,0,.07));padding:20px;border-radius:16px;line-height:1.6}

.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px;align-items:start}.sidebar{position:sticky;top:92px;max-height:calc(100vh - 110px);overflow:auto;background:#0b0b12;border:1px solid var(--border);border-radius:14px;padding:14px}.sideTitle{font-family:"Cormorant Garamond";color:#d5b45c;margin:0 0 10px}.mapNode{padding:7px 8px;margin:5px 0;border-radius:7px;border:1px solid #241c12;color:#6e675b;font-size:.75rem}.mapNode.solved{color:#e7d49f;border-color:#6a4d11;box-shadow:0 0 10px rgba(184,134,11,.14)}.mapNode.current{color:#fff0b8;border-color:#d49b1a;background:#241909;animation:pulse 1.55s infinite}@keyframes pulse{50%{box-shadow:0 0 18px rgba(213,156,25,.35)}}.keys{display:flex;flex-wrap:wrap;gap:5px}.key{font-size:1.25rem;opacity:.22;filter:grayscale(1)}.key.earned{opacity:1;filter:none;animation:keyPop .5s}@keyframes keyPop{50%{transform:scale(1.45) rotate(-12deg)}}
.panel{background:linear-gradient(#11111b,#0d0d15);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.36)}.stationHead{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.act{font-size:.72rem;font-weight:800;color:#9d7722;letter-spacing:.15em}.room{font-size:2.15rem;margin:3px 0;font-weight:700;letter-spacing:.01em}.topic{font-size:.85rem;color:var(--muted)}.typePill{white-space:nowrap;padding:7px 10px;border:1px solid #5d461c;color:#f0d27e;border-radius:999px;font-size:.72rem;font-weight:800}
.chefBox{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:18px 20px;background:radial-gradient(circle at 5% 50%,rgba(184,134,11,.13),transparent 34%);border-bottom:1px solid #241b10}.chefEmoji{font-size:3.4rem;display:grid;place-items:center;filter:drop-shadow(0 0 10px rgba(255,155,0,.16))}.chefName{color:#e5c673;font-weight:800}.chefStatus{text-transform:uppercase;font-size:.68rem;color:#a49478;letter-spacing:.08em;margin:3px 0 8px}.chefText{line-height:1.62;font-family:"Cormorant Garamond",serif;font-size:1.18rem;font-weight:600}
.question{padding:22px}.situation{margin:0 0 17px;line-height:1.55;color:#c5bdae}.option,.model,.versionCard{display:block;width:100%;text-align:left;border:1px solid #332819;background:#12121c;color:var(--text);padding:13px 14px;border-radius:10px;margin:9px 0;transition:.18s}.option:hover,.model:hover,.versionCard:hover{border-color:#896816;transform:translateY(-1px);background:#17151b}.correct{border-color:#4f994f!important;background:#102214!important}.wrong{border-color:#a73820!important;background:#24100d!important;animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.feedback{margin-top:16px;padding:14px;border-radius:10px;line-height:1.55;border:1px solid #3d2d17;background:#0c0c11}.feedback.ok{border-color:#356d35}.feedback.bad{border-color:#7e2718}
.formulaStage{font-family:monospace;font-size:1.15rem;background:#08090b;border:1px solid #393125;padding:17px;border-radius:10px;min-height:58px}.tokenBank,.chosenBank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.token{background:#1e1b12;border:1px solid #735712;color:#f1d78d;border-radius:8px;padding:9px 12px}.token.used{opacity:.25;pointer-events:none}.token.selected{outline:2px solid #d8a82a}.formulaPart{display:inline-block;padding:5px 3px;border-radius:5px}.formulaPart.clickable{border-bottom:1px dashed #a98427}.formulaPart.clickable:hover{background:#2c2414}
.rapidQ{border:1px solid #302617;padding:12px;border-radius:10px;margin:10px 0}.tfrow{display:flex;gap:8px;margin-top:9px}.tfbtn{flex:1;border:1px solid #514022;background:#17151a;color:#eee3c9;padding:9px;border-radius:8px}.tfbtn.active{border-color:#d29c1c;background:#2a210d}.explain{display:block;margin-top:8px;color:#aaa08d}
.excel{width:100%;border-collapse:collapse;font-size:.84rem}.excel th,.excel td{border:1px solid #343434;padding:10px;vertical-align:top}.excel th{background:#1a1a20}.clickcell{cursor:pointer}.clickcell:hover{background:#211d12}
.modelGrid,.versionGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.model h4,.versionCard h4{margin:.2rem 0 .8rem}.row{display:flex;justify-content:space-between;border-top:1px solid #28231a;padding:8px 0;gap:12px}.row span:last-child{text-align:right;color:#e8d595}
.sequenceList{display:grid;gap:8px}.seqItem{display:grid;grid-template-columns:36px 1fr 90px;gap:8px;align-items:center;border:1px solid #352c1d;padding:9px;border-radius:9px;background:#13131b}.seqBtns{display:flex;gap:4px}.mini{background:#221c10;color:#e4c66f;border:1px solid #62501f;border-radius:6px;padding:5px 8px}
.dragBank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.dragItem{padding:10px 11px;border:1px solid #72591c;border-radius:8px;background:#1d180e;color:#ecd894;touch-action:none}.dropZone{min-height:55px;border:1px dashed #5e4b24;border-radius:9px;padding:9px;margin:9px 0}.dropZone b{display:block;color:#d2b766;margin-bottom:6px}.matchGrid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}.matchTarget{min-height:58px;padding:10px;border:1px dashed #65512a;border-radius:9px;margin:8px 0}.matchTarget small{color:#aaa18c;display:block;margin-bottom:6px}
.fill{background:#08090b;color:#f0da98;border:1px solid #6c5218;padding:9px;border-radius:7px;min-width:170px}.sliderBox{border:1px solid #3c301b;padding:15px;border-radius:12px;background:#0b0b10}.sliderBox input{width:100%}.bigValue{font-size:2rem;font-weight:900;color:#e4bd53}.boltTabs{display:flex;justify-content:center;gap:20px;margin:5px 0 18px}.bolt{font-size:1.8rem;opacity:.32}.bolt.open{opacity:1;filter:drop-shadow(0 0 8px #c79a2a)}.goalGrid{display:grid;gap:10px}.goalField{border:1px dashed #6e5829;padding:12px;border-radius:9px;min-height:55px}.goalField b{display:block;color:#d4b75f;margin-bottom:6px}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.87);display:grid;place-items:center;padding:20px}.overlayCard{width:min(700px,100%);text-align:center;border:1px solid #694711;background:#0c0c11;border-radius:17px;padding:28px;box-shadow:0 0 60px rgba(184,134,11,.15)}.emergency{font-size:1.15rem;line-height:1.65}.toast{position:fixed;right:18px;bottom:18px;z-index:120;max-width:370px;background:#17120b;border:1px solid #9c7419;color:#f5e4b2;padding:13px 15px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:toastIn .3s}@keyframes toastIn{from{transform:translateY(20px);opacity:0}}.idleBubble{position:fixed;right:18px;top:118px;z-index:80;background:#17120b;border:1px solid #74581c;border-radius:12px;padding:12px 14px;max-width:280px;color:#f0ddb0}
.end{text-align:center;padding:35px 20px}.rank{font-family:"Cormorant Garamond";font-size:2rem;color:#e1bc59;margin:12px 0}.stats{max-width:650px;margin:20px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;border:1px solid #3c2c14;border-radius:10px;background:#101018}.achievements{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.badge{padding:8px 10px;border:1px solid #5d491c;border-radius:999px;background:#18140c;color:#d5bb72;font-size:.78rem}.emailCard{max-width:520px;margin:25px auto 0;text-align:left;border:1px solid #5b451c;background:#111018;border-radius:12px;padding:16px}.dimWine{box-shadow:inset 0 0 90px rgba(145,89,8,.12),0 20px 55px rgba(0,0,0,.45)}
@media(max-width:820px){.topgrid{grid-template-columns:1fr}.score{text-align:left}.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.modelGrid,.versionGrid,.matchGrid{grid-template-columns:1fr}.chefBox{grid-template-columns:58px 1fr}.chefEmoji{font-size:2.6rem}.stationHead{flex-direction:column}.stats{grid-template-columns:1fr}}
</style>

<body>
<div class="topbar hidden" id="topbar">
 <div class="topgrid">
  <div class="timer">HEALTH INSPECTOR ARRIVES IN <strong id="time">45:00</strong></div>
  <div><div class="meterWrap"><div id="meter" class="meter"></div></div><div id="meterLabel" class="meterLabel">🟢 QUESTIONABLE</div></div>
  <div class="score">First try: <b id="score">0</b>/13 &nbsp; <span class="streak">🔥 <span id="streak">0</span></span></div>
 </div>
</div>
<div id="app"></div>
<div id="toastHost"></div><div id="idleHost"></div>
<script>
const COPYRIGHT="© Dr. Amir Fard Bahreini";
const stations=[
{id:1,room:"The Walk-In Freezer",topic:"Excel Tables",type:"multiple-choice",typeLabel:"Multiple Choice",emoji:"👨‍🍳",status:"Stress Level: ELEVATED",key:"TABLE",
chef:"Ah. Ze new analyst. Welcome to Chez Catastrophe. Ze door is locked. Ze inventory list has 847 rows of ingredient data. Every time my sous chef adds a new item, ze SUMIF formula stops including it. Ze totals go wrong. Ze ordering goes wrong. We run out of truffle. Do you understand what it means to run out of truffle?! What is ze fix?",
situation:"The ingredient inventory is a plain data range. New rows added below it are not picked up by the SUMIF formulas above. The sous chef adds items daily.",
choices:[
["Convert the range to an Excel Table named IngredientStock so formulas and totals expand automatically to include new rows",1,"Oui! A Table auto-expands. New ingredient added, formulas update, totals recalculate, truffle is safe. Ze freezer door clicks open. Chef exhales. It is the first time today."],
["Manually extend every SUMIF range each time the sous chef adds a new ingredient",0,"Sacré spreadsheet! You want ze sous chef to update ze formulas at 11pm during service?! He barely knows where ze colander is!"],
["Use VLOOKUP instead of SUMIF so new rows do not matter",0,"VLOOKUP finds a single value. It does not SUM a column. What in ze pivot are you suggesting?"],
["Copy the last row down to force the range to extend",0,"Ze last row of truffle data copied down becomes two rows of truffle data. Ze truffle is now doubled on paper and gone in reality. MATHEMATICS."]
]},
{id:2,room:"The Prep Kitchen",topic:"Structured References",type:"build-formula",typeLabel:"Build the Formula",emoji:"😤",status:"Stress Level: VOLCANIC",key:"[Revenue]",
chef:"Ze daily revenue report needs ze total revenue from ze SalesLog Table. Not a cell address. If someone moves ze column, ze cell address breaks and I discover it DURING SERVICE. I need a structured reference. Build it now or you peel onions. ALL of them.",
situation:"Build the formula that sums the Revenue column from the SalesLog Table using structured reference syntax.",tokens:["=","SUM","(","SalesLog","[","Revenue","]",")"],target:"=SUM(SalesLog[Revenue])",
right:"Mon dieu, you actually did it. =SUM(SalesLog[Revenue]). Ze column can move, ze table can grow, ze formula holds. Ze prep kitchen unlocks. Try not to ruin ze next one.",
wrong:"What the croissant?! Ze brackets go AROUND ze column name. INSIDE ze table name. SalesLog[Revenue]. Not ze other way. Never ze other way."},
{id:3,room:"The Garnish Station",topic:"Calculated Columns and IF",type:"fix-bug",typeLabel:"Fix the Bug",emoji:"😱",status:"Stress Level: SUPERNATURAL",key:'"Profitable"',
chef:"Ze MenuItems Table has a Profitable column. It should say Profitable or Loss for each dish based on ze ProfitMargin. Every single row says FALSE. Ze entire menu is apparently a loss. We are not a loss, we are Chez Catastrophe! Something in ze formula is broken. FIND IT.",
situation:"The formula below checks each menu item's ProfitMargin. It returns FALSE for every row. One part is wrong. Click the broken part.",parts:["=IF(","[@ProfitMargin]",">0, ","Profitable",", ","Loss",")"],bad:[3,5],
right:'Holy VLOOKUP! Text values need quotes! =IF([@ProfitMargin]>0, "Profitable", "Loss"). Excel was looking for a named range called Profitable. There is no such thing. Ze garnish station unlocks.',
wrong:"Absolute ratatouille! Look at ze text values. Do they have quotes? Non? ZEN THAT IS ZE PROBLEM. Excel thinks Profitable is a named range. It is not."},
{id:4,room:"The Slicer Pantry",topic:"Slicers and Dynamic Filtering",type:"true-false",typeLabel:"Rapid Fire",emoji:"🔥",status:"Stress Level: HAUNTED",key:"TRUE",
chef:"Ze slicer pantry has THREE locks. Three questions. True or False. If you get one wrong I am not responsible for what happens to ze soufflé. It is already having a difficult evening. GO.",situation:"Answer all three quickly. These are fundamental slicer rules.",
qs:[
["When a slicer is inserted from a Table, it filters only that Table by default.",true,"True. A slicer inserted from a Table filters that Table only. Connecting it to additional Tables requires manually setting up Report Connections for each one."],
["Clicking the X icon in the top-right corner of a slicer panel clears all active filter selections for that slicer.",true,"True. The X button clears the slicer completely. Every selection is removed and all rows become visible again."],
["A Timeline slicer works on any column including text columns like Server or Section.",false,"False. A Timeline slicer only works on date-formatted columns. Text columns like Server or Section require a regular slicer, not a Timeline."]
],right:"Ze pantry is open. Three locks, three correct answers. Chef nods. It is the most respect he has shown anyone today.",wrong:"Son of a slicer! Go back and read ze question again. Ze answer was right there."},
{id:5,room:"The Cold Pass",topic:"SUBTOTAL vs SUM in Filtered Tables",type:"hotspot",typeLabel:"Click the Cell",emoji:"😵",status:"Stress Level: BEYOND MORTAL",key:"SUBTOTAL",
chef:"Ze SalesLog Table is filtered to show only Weekend shifts. I need ze total revenue for WEEKENDS ONLY. But there are two formula cells below ze table. One uses SUM. One uses SUBTOTAL. Ze dashboard is watching. Ze KPI card is watching. I am watching. Click ze cell that shows ze correct filtered total.",
situation:"The SalesLog Table is filtered to Weekend shifts. Click the cell that shows the revenue total for visible rows only, not the full dataset total.",
cells:[["Total Revenue (SUM)","=SUM(SalesLog[Revenue])","$847,293",0],["Total Revenue (SUBTOTAL)","=SUBTOTAL(9,SalesLog[Revenue])","$312,847",1]],
right:"Oui! SUBTOTAL sees only ze visible rows. SUM is blind to ze filter and adds everything. On a dashboard, that is USELESS. Ze cold pass key is yours. Also ze dashboard now shows ze right number.",
wrong:"Son of a slicer! That is ze SUM formula. It shows ze full dataset total even when rows are hidden. Ze SUBTOTAL is ze one that responds to ze filter. Always SUBTOTAL on a dashboard."},
{id:6,room:"The Line",topic:"Dashboards — KPI Formula Choice",type:"spot-diff",typeLabel:"Spot the Difference",emoji:"👻",status:"Stress Level: APOCALYPTIC",key:"9",
chef:"Ze restaurant dashboard has TWO KPI cards for Weekend Revenue. One is ze CORRECT formula for a dashboard. One is a lie dressed up as a number. Ze health inspector will filter ze dashboard by Section. One card updates. One does not. WHICH IS CORRECT. I cannot look directly at ze wrong one.",
situation:"The SalesLog is filtered to Weekend shifts. The dashboard shows two revenue cards. Click the one built correctly for a dashboard that responds to filters.",
models:[["KPI Card A",0,[["Formula","=SUM(SalesLog[Revenue])"],["Result","$847,293"],["When filtered:","Still shows $847,293"]]],["KPI Card B",1,[["Formula","=SUBTOTAL(9,SalesLog[Revenue])"],["Result","$312,847"],["When filtered:","Updates automatically"]]]],
right:"SUBTOTAL! It sees ze filter. SUM is blind like a truffle pig with no nose. Card B is correct. Ze Line is open. Ze dashboard is alive.",
wrong:"What in ze pivot! SUM adds everything regardless of filter. On ze dashboard, that is worse than useless. It is CONFIDENTLY WRONG."},
{id:7,room:"The Plating Table",topic:"Dashboards — Chart Type Selection",type:"multiple-choice",typeLabel:"Multiple Choice",emoji:"🧯",status:"Stress Level: RE-IGNITED (holding extinguisher)",key:"COMBO",
chef:"Ze dashboard needs a chart. Revenue by Day of Week on ze primary axis. Average Covers — that is, guests served — on ze secondary axis. Revenue is in thousands of dollars. Covers is twelve to eighty. THESE DO NOT LIVE ON ZE SAME SCALE. What type of chart do I build. And if you say pie chart I will extinguish something.",
situation:"Revenue by DayOfWeek and average Covers served need to appear on the same chart. They use completely different scales.",
choices:[
["Pie chart showing Revenue as slices by day",0,"A pie chart for seven days of revenue shows nothing about Covers. Also I specifically said not ze pie chart. Did you hear nothing?"],
["Line chart with Revenue and Covers on the same axis",0,"Ze Revenue line reaches $47,000. Ze Covers line reaches 34. On ze same axis, ze Covers line is invisible. Ze guests are invisible. We have invisible guests."],
["Combo chart: Revenue as columns on primary axis, Covers as a line on secondary axis",1,"A combo chart! Primary axis for Revenue in thousands, secondary axis for Covers in dozens. Both readable, both correct. Ze plating table is unlocked. Ze chart is beautiful. I am... moved."],
["Two separate bar charts side by side",0,"Two separate charts is two separate problems. A combo chart puts both on one canvas. Ze dashboard has limited space. Ze restaurant has limited patience."]
]},
{id:8,room:"The Pass Window",topic:"Dashboard Design Layer",type:"sequence",typeLabel:"Put in Order",emoji:"💀",status:"Stress Level: EXISTENTIAL",key:"NO BORDER",
chef:"Ze combo chart exists. But it looks like it was assembled by someone eating a sandwich with one hand. We apply ze design layer. In ze correct order. A poorly designed chart in my restaurant is a violation of everything I believe. Put ze steps in order. NOW.",
situation:"Drag these chart design steps into the correct sequence from first to last. Order matters — you cannot add a direct label before removing the legend.",
steps:["Remove the chart border: right-click chart area, Format Chart Area, Border: No Line","Delete the legend from the chart","Add a direct text label on the Covers line","Change the Revenue bars to teal","Remove chart gridlines: right-click gridlines, Delete"],
right:"Oui! Border gone, legend gone, direct label, teal bars, no gridlines. Ze chart is clean. Ze pass window is open. Ze dashboard is ready for ze health inspector. Almost.",
wrong:"What the croissant! You cannot add a direct label before deleting ze legend — you will have BOTH and ze chart looks like an argument. Order matters in ze kitchen. Order matters in ze chart."},
{id:9,room:"The Wine Cellar",topic:"Advanced Pivot Tables — Value Field Settings",type:"matching",typeLabel:"Match the Pairs",emoji:"🤯",status:"Stress Level: ONE SLEEVE MISSING",key:"% GRAND TOTAL",
chef:"Ze wine cellar has six bottles. Each bottle is a Value Field Setting in a Pivot Table built from ze SalesLog. Match each setting to what it actually does or I will serve ze wrong wine with ze fish. Ze wrong wine with ze fish is a catastrophe I have experienced once. ONCE.",
situation:"Drag each Value Field Setting on the left to its correct description on the right.",
pairs:[["SUM","Total revenue across all days in the SalesLog"],["COUNT","Number of service shifts in each section"],["AVERAGE","Mean covers served per shift"],["% of Grand Total","Each server's share of total restaurant revenue"],["Running Total In","Cumulative revenue building quarter by quarter"],["Rank Largest to Smallest","Which server ranks first, second, third by revenue"]],
right:"Every bottle in ze right place. SUM, COUNT, AVERAGE, percentage, running total, rank. Ze wine cellar is yours. I am almost proud. Do not tell anyone.",
wrong:"You miserable cell reference! % of Grand Total does not AVERAGE anything. It shows proportional share. Read ze label on ze bottle before you pour."},
{id:10,room:"The Sommelier's Table",topic:"Calculated Fields in Pivot Tables",type:"fill-blank",typeLabel:"Fill in the Blank",emoji:"🫠",status:"Stress Level: MELTING",key:"CostRatio",
chef:"Ze SalesLog Pivot Table needs a calculated field for Net Revenue after we subtract ze kitchen costs. Ze formula is Revenue multiplied by one minus CostRatio. I need you to fill in ze missing field name. Ze field name is exactly as it appears in ze source data. Exactly. Do not be creative. I cannot handle creative right now.",
situation:"Complete the calculated field formula that calculates net revenue after cost deduction.",
right:"Oui! Revenue * (1 - CostRatio). Ze calculated field applies to ze aggregated pivot values. Ze sommelier's table unlocks. Ze sommelier has stopped crying. Briefly.",
wrong:"For the love of SUMIF! Ze field name is CostRatio. Exactly as it appears in ze SalesLog column. No spaces, no guessing, no synonyms. Ze pivot table does not understand synonyms."},
{id:11,room:"The Manager's Office",topic:"Data Validation — Rule Types",type:"drag-drop",typeLabel:"Drag and Drop",emoji:"😤",status:"Stress Level: BRIEF RALLY (false hope)",key:"STOP",
chef:"Ze reservation entry form needs validation rules. Some violations are CATASTROPHIC — Stop them before zey happen. Some are suspicious but occasionally valid — Warning only, let ze manager decide. Some are just helpful reminders — Information, no blocking. Sort ze rules. Ze manager's office unlocks when you do.",
situation:"Drag each validation scenario into the correct alert category: Stop, Warning, or Information.",
items:[["Duplicate ReservationID entered","stop"],["Guest name left blank","stop"],["ReservationDate in the past","stop"],["Party size above 12 (large parties need extra setup)","warning"],["Revenue per cover below the restaurant average","warning"],["Reservation made less than 2 hours before service","information"]],
right:"PARFAIT! Stop for integrity violations, Warning for unusual but sometimes valid entries, Information for guidance without friction. Ze manager's office is open.",
wrong:"Absolute ratatouille! A duplicate ReservationID is not a Warning. It is a CATASTROPHE. It corrupts every SUMIF and every pivot that uses it as a key. That is a STOP. Always a STOP."},
{id:12,room:"The Chef's Table",topic:"Named Ranges and Professional Reports",type:"before-after",typeLabel:"Before and After",emoji:"🎩",status:"Stress Level: WEARING AN OVEN MITT ON HEAD (unexplained)",key:"TotalRevenue",

function moveSeq(i,d){let j=i+d;if(j<0||j>=S.sequence.length)return;[S.sequence[i],S.sequence[j]]=[S.sequence[j],S.sequence[i]];document.getElementById("sequenceList").outerHTML=sequenceHTML().replace(/<button class="checkBtn"[\s\S]*/,"")}
function checkSequence(){let s=stations[S.idx],ok=S.sequence.every((x,i)=>x.orig===i);ok?complete(s.right):fail(s.wrong)}
function dragItem(text,kind,idx){return `<button class="dragItem" draggable="true" data-kind="${kind}" data-idx="${idx}" data-text="${encodeURIComponent(text)}" onclick="selectDrag(this)" ondragstart="dragStart(event)">${esc(text)}</button>`}
function selectDrag(el){document.querySelectorAll(".dragItem").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");S.selectedDrag={kind:el.dataset.kind,idx:+el.dataset.idx,text:decodeURIComponent(el.dataset.text),el}}
function dragStart(e){let el=e.currentTarget;e.dataTransfer.setData("text/plain",JSON.stringify({kind:el.dataset.kind,idx:+el.dataset.idx,text:decodeURIComponent(el.dataset.text)}))}
function placeInZone(data,zone){let prior=zone.querySelector(".dragItem");if(prior){document.getElementById(prior.dataset.kind==="match"?"matchBank":"validationBank").appendChild(prior)}let item=[...document.querySelectorAll(".dragItem")].find(x=>x.dataset.kind===data.kind&&+x.dataset.idx===data.idx);if(item){zone.querySelector(".slotContent").appendChild(item);item.classList.remove("selected")}S.selectedDrag=null}
function dropMatch(e,target,zone){e.preventDefault();let d=JSON.parse(e.dataTransfer.getData("text/plain"));if(d.kind==="match")placeInZone(d,zone)}
function tapDropMatch(target,zone){if(S.selectedDrag&&S.selectedDrag.kind==="match")placeInZone(S.selectedDrag,zone)}
function checkMatch(){let s=stations[S.idx],zones=[...document.querySelectorAll(".matchTarget")],ok=zones.every((z)=>{let item=z.querySelector(".dragItem");if(!item)return false;let targetIdx=s.pairs.findIndex(p=>p[1]===z.querySelector("small").textContent);return +item.dataset.idx===targetIdx});ok?complete(s.right):(zones.forEach(z=>{let item=z.querySelector(".dragItem");if(item)document.getElementById("matchBank").appendChild(item)}),fail(s.wrong))}
function validationHTML(s){return `<div id="validationBank" class="dragBank">${s.items.map((x,i)=>dragItem(x[0],"validation",i)).join("")}</div><div class="dropZone" data-cat="stop" onclick="tapDropValidation(this)" ondragover="event.preventDefault()" ondrop="dropValidation(event,this)"><b>🚫 Stop — Block entry</b><div class="slotContent"></div></div><div class="dropZone" data-cat="warning" onclick="tapDropValidation(this)" ondragover="event.preventDefault()" ondrop="dropValidation(event,this)"><b>⚠️ Warning — Flag but allow</b><div class="slotContent"></div></div><div class="dropZone" data-cat="information" onclick="tapDropValidation(this)" ondragover="event.preventDefault()" ondrop="dropValidation(event,this)"><b>ℹ️ Information — Remind only</b><div class="slotContent"></div></div><button class="checkBtn" onclick="checkValidation()">Check Rules</button>`}
function appendValidation(data,zone){let item=[...document.querySelectorAll(".dragItem")].find(x=>x.dataset.kind==="validation"&&+x.dataset.idx===data.idx);if(item){zone.querySelector(".slotContent").appendChild(item);item.classList.remove("selected")}S.selectedDrag=null}
function dropValidation(e,zone){e.preventDefault();let d=JSON.parse(e.dataTransfer.getData("text/plain"));if(d.kind==="validation")appendValidation(d,zone)}
function tapDropValidation(zone){if(S.selectedDrag&&S.selectedDrag.kind==="validation")appendValidation(S.selectedDrag,zone)}
function checkValidation(){let s=stations[S.idx],ok=true;document.querySelectorAll(".dropZone").forEach(z=>z.querySelectorAll(".dragItem").forEach(item=>{if(s.items[+item.dataset.idx][1]!==z.dataset.cat)ok=false}));if(document.getElementById("validationBank").children.length)ok=false;ok?complete(s.right):fail(s.wrong)}
function checkFill(){let s=stations[S.idx],v=document.getElementById("fillAnswer").value.trim();v==="CostRatio"?complete(s.right):fail(s.wrong)}
function chooseVersion(btn,i){let s=stations[S.idx];if(s.versions[i][4]){btn.classList.add("correct");document.getElementById("after0").classList.remove("hidden");document.getElementById("after1").classList.remove("hidden");document.getElementById("after0").parentElement.classList.add("wrong");document.getElementById("after1").parentElement.classList.add("correct");setTimeout(()=>complete(s.right),700)}else{btn.classList.add("wrong");fail(s.wrong)}}
function bossHTML(){return `<div class="boltTabs"><span id="bolt0" class="bolt">🔒</span><span id="bolt1" class="bolt">🔒</span><span id="bolt2" class="bolt">🔒</span></div><div id="bossStage">${bossStageHTML()}</div>`}
function bossStageHTML(){if(S.boss===0)return `<h3>BOLT 1 — Find the Target</h3><p>Chez Catastrophe has 100 seatings per month. Average revenue per seating is currently $142. Drag the slider to find the average needed to reach exactly $20,000.</p><div class="sliderBox"><div class="bigValue">$<span id="sliderVal">142</span> per seating</div><input id="goalSlider" type="range" min="100" max="300" value="142" step="1" oninput="sliderReact(this.value)"><div>Total projected revenue: <b>$<span id="projected">14,200</span></b></div><div id="sliderChef" style="margin-top:10px;color:#d4b96f">Chef is staring at the slider.</div></div><button class="checkBtn" style="margin-top:12px" onclick="checkBolt1()">Set Target</button>`;if(S.boss===1)return `<h3>BOLT 2 — Name the Tool</h3><p>Which Excel tool automatically works backward from a desired output to find the required input value?</p>${[["VLOOKUP — finds a matching value in a table",0],["Goal Seek — sets a target, identifies the input, Excel finds the answer",1],["Scenario Manager — tests multiple named input combinations",0],["Data Tables — generates a grid of outputs across input combinations",0]].map((x,i)=>`<button class="option" onclick="checkBolt2(this,${i},${x[1]})">${x[0]}</button>`).join("")}`;return `<h3>BOLT 3 — Configure Goal Seek</h3><p>Tap an item, then tap the correct Goal Seek field. Drag-and-drop also works on desktop.</p><div id="goalBank" class="dragBank">${dragItem("Total Monthly Revenue cell","goal",0)}${dragItem("$20,000","goal",1)}${dragItem("Average Revenue per Seating cell","goal",2)}</div><div class="goalGrid">${[["set-cell","Set cell:"],["to-value","To value:"],["by-changing","By changing cell:"]].map((f,i)=>`<div class="goalField" data-target="${i}" onclick="tapDropGoal(this)" ondragover="event.preventDefault()" ondrop="dropGoal(event,this)"><b>${f[1]}</b><div class="slotContent"></div></div>`).join("")}</div><button class="checkBtn" onclick="checkBolt3()">OPEN FINAL BOLT</button>`}
function sliderReact(v){v=+v;document.getElementById("sliderVal").textContent=v;document.getElementById("projected").textContent=(v*100).toLocaleString();document.getElementById("sliderChef").textContent=v<=160?"Non. We cannot afford ze butter.":v<=185?"Closer… but ze soufflé is still unimpressed.":v<200?"DO NOT STOP NOW. ZE DOOR IS LISTENING.":v===200?"MON DIEU. $200. ZE BOLT IS MOVING.":"You have gone too far. As with everything in life."}
function openBolt(){document.getElementById("bolt"+S.boss).textContent="🔓";document.getElementById("bolt"+S.boss).classList.add("open");toast("<b>CLUNK 🔓</b>",1300);S.boss++;setTimeout(()=>{if(S.boss<3)document.getElementById("bossStage").innerHTML=bossStageHTML();else finale()},700)}
function checkBolt1(){+document.getElementById("goalSlider").value===200?openBolt():fail("Mon dieu! One hundred seatings must average exactly $200 each to hit $20,000. Ze door can do arithmetic.")}
function checkBolt2(btn,i,ok){if(ok){btn.classList.add("correct");openBolt()}else{btn.classList.add("wrong");if(i===0)S.vlookupWrong=true;fail(i===0?"VLOOKUP finds things. It does not calculate backward from targets. Different tool, different universe.":i===2?"Scenario Manager tests scenarios you define. Goal Seek finds the one required input from a target.":"A Data Table generates many outputs. Goal Seek finds one specific answer from one specific target.")}}
function appendGoal(data,zone){let item=[...document.querySelectorAll(".dragItem")].find(x=>x.dataset.kind==="goal"&&+x.dataset.idx===data.idx);if(item){let prior=zone.querySelector(".dragItem");if(prior)document.getElementById("goalBank").appendChild(prior);zone.querySelector(".slotContent").appendChild(item);item.classList.remove("selected")}S.selectedDrag=null}
function dropGoal(e,zone){e.preventDefault();let d=JSON.parse(e.dataTransfer.getData("text/plain"));if(d.kind==="goal")appendGoal(d,zone)}
function tapDropGoal(zone){if(S.selectedDrag&&S.selectedDrag.kind==="goal")appendGoal(S.selectedDrag,zone)}
function checkBolt3(){let ok=[...document.querySelectorAll(".goalField")].every(z=>{let i=z.querySelector(".dragItem");return i&&+i.dataset.idx===+z.dataset.target});ok?openBolt():fail("For the love of SUMIF! Set cell is Total Monthly Revenue, To value is $20,000, and By changing cell is Average Revenue per Seating.")}
function finale(){clearIdle();S.questionActive=false;S.keys.push("$200");if(!S.vlookupWrong)achievement("oui_vlookup","Oui Oui VLOOKUP");achievement("brunch_survivor","Brunch Survivor");if(S.wrong===0)achievement("chefs_kiss","Chef's Kiss");overlay("╔══════════════════════════╗<br>║ &nbsp; EXIT UNLOCKED &nbsp; ║<br>╚══════════════════════════╝","🔓 🔓 🔓<br><br>The door opens slowly.<br>🚪 A health inspector silhouette appears.<br><br><b>Chef Maxime:</b> “…That is unfortunate.”<br><br>🗝️ All 13 keys slam into the locks.<br>🎉 Confetti. One dignified tear. ⭐",4200,renderEnd)}
function nextStation(){let completed=stations[S.idx].id;if(completed===13)return;if(emergencyAfter[completed]){let e=emergencyAfter[completed];overlay(e[0],e[1],2600,()=>advance())}else if(completed===8){overlay("💡 THE LIGHTS GO OUT.","<div style='font-size:2rem'>…</div><br>Chef: “Ze wine cellar always does zis. Do not panic. I am panicking.”",2600,()=>advance())}else advance()}
function advance(){S.idx++;S.boss=0;renderStation()}
function renderEnd(){clearInterval(S.timer);document.getElementById("topbar").classList.add("hidden");let n=S.firstTry,rank=n===13?["👨‍🍳 EXECUTIVE CHEF","Perfect. Flawless. Chef Maxime has retired. You are the restaurant now."]:n>=11?["🎖️ SOUS CHEF","Outstanding. Chez Catastrophe has its first Michelin star. Chef credits you. Quietly."]:n>=8?["😅 LINE COOK","Solid work. The health inspector gave us a conditional pass. Chef Maxime is relieved."]:n>=5?["🧑‍🍳 PREP COOK","You survived. The restaurant survived. Barely. Review the stations where you stumbled."]:["🍽️ DISHWASHER","The curse remains. But every chef started somewhere. Come back. Try again."];let names={no_ref:"No More #REF!",son_of_slicer:"Son of a Slicer",pivot_thickens:"The Pivot Thickens",oui_vlookup:"Oui Oui VLOOKUP",brunch_survivor:"Brunch Survivor",chefs_kiss:"Chef's Kiss",ratatouille:"Absolute Ratatouille",sous_vide:"Sous Vide Speed",mise_en_place:"Mise en Place",pivot_warlord:"Pivot Warlord",sommelier:"The Sommelier Approves"};document.getElementById("app").innerHTML=`<div class="screen"><section class="end"><div class="kicker">YOU ESCAPED CHEZ CATASTROPHE</div><h1 style="font-size:clamp(2.8rem,7vw,5.5rem)">Freedom.</h1><div class="rank">${rank[0]}</div><p>${rank[1]}</p><div class="stats"><div class="stat"><b>13/13</b><br>Stations escaped</div><div class="stat"><b>${S.firstTry}/13</b><br>First-try correct</div><div class="stat"><b>${fmt(S.time)}</b><br>Time remaining</div><div class="stat"><b>${S.wrong}</b><br>Catastrophes triggered</div><div class="stat" style="grid-column:1/-1"><b>${S.longest}</b><br>Longest combo</div></div><h3>Achievements</h3><div class="achievements">${[...S.ach].map(x=>`<span class="badge">🏆 ${names[x]||x}</span>`).join("")||"<span class='badge'>The real achievement was surviving Chef Maxime.</span>"}</div><div class="emailCard hidden" id="email"><b>📧 NEW EMAIL RECEIVED</b><hr style="border-color:#342810"><b>From:</b> Chef Maxime Beaudesastre<br><b>To:</b> You<br><b>Subject:</b> Tomorrow's shift<br><br><b>8:00 AM.</b><br>Bring Power BI.</div><button class="cta" style="margin-top:22px" onclick="location.reload()">Play Again</button></section>${footer()}</div>`;setTimeout(()=>document.getElementById("email").classList.remove("hidden"),3000)}
renderHome();
</script>
</body>
