<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashes in the Data — A Copilot Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d12;--panel:#0f151c;--line:#26323d;--text:#d8e1e8;--muted:#7f8d99;--green:#96b69a;--amber:#c1a16a;--red:#8f4848;--blue:#7f9eaf;--shadow:rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05080b;color:var(--text);font-family:Inter,Arial,sans-serif}
body{background:radial-gradient(circle at 20% 0%,rgba(55,73,87,.16),transparent 30%),linear-gradient(180deg,#080c11,#05070a 72%)}
button{font:inherit;cursor:pointer;min-height:44px}.hidden{display:none!important}#app{min-height:100vh}

/* BOOT */
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(255,255,255,.015) 50%,transparent 50%);background-size:100% 4px}
.bootbox{width:min(760px,100%);border:1px solid #293540;background:#070b0f;padding:22px;box-shadow:0 20px 60px #000;font-family:"IBM Plex Mono",monospace}
.bootline{opacity:0;transform:translateY(4px);transition:.35s;margin:7px 0;color:#9fb1bd}.bootline.show{opacity:1;transform:none}
.bootline.alert{color:#c19a75}.bootline.cop{color:#b8d3c1}
.bootBtn{margin-top:20px;background:#111b22;color:#d9e4ea;border:1px solid #3a4a56;padding:11px 18px;border-radius:4px;font-size:.9rem}

/* SCREENS */
.screen{max-width:960px;margin:0 auto;padding:24px 16px;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.footer{text-align:center;color:#56646d;font-size:.7rem;padding:16px}

/* HOME */
.homeHero{text-align:center;padding:60px 16px 32px}
.gameKicker{font:700 .7rem "IBM Plex Mono",monospace;color:var(--amber);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.gameTitle{font:700 3.2rem "IBM Plex Mono",monospace;color:#c8d8df;margin:0 0 6px;line-height:1.1}
.gameSub{font:400 1rem "IBM Plex Mono",monospace;color:var(--muted);margin-bottom:28px}
.homeCard{border:1px solid #26333d;background:#0e151c;padding:22px;max-width:680px;margin:0 auto 24px;line-height:1.7;color:#c8d4da}
.ctaBtn{background:linear-gradient(135deg,#1a2d3a,#0f1e28);color:#a8d4c4;border:1px solid #3d6070;padding:13px 28px;border-radius:5px;font:600 .9rem "IBM Plex Mono",monospace;letter-spacing:.08em;transition:.2s}
.ctaBtn:hover{border-color:#5d8a9a;background:linear-gradient(135deg,#1e3545,#132530)}

/* CHARACTERS */
.charGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:760px;margin:24px auto}
.charCard{border:1px solid #26333d;background:#0e151c;padding:24px;text-align:center}
.charIcon{font-size:3rem;margin-bottom:12px}
.charName{font:600 .8rem "IBM Plex Mono",monospace;color:var(--amber);letter-spacing:.1em;margin-bottom:8px}
.charDesc{font-size:.88rem;color:#bac8d0;line-height:1.6}

/* HOW TO PLAY */
.howSection{border:1px solid #26333d;background:#0e151c;padding:18px;margin:12px 0}
.howTitle{font:600 .75rem "IBM Plex Mono",monospace;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.mechList{list-style:none;padding:0;margin:0}
.mechList li{padding:7px 0;border-bottom:1px solid #1e2d36;font-size:.86rem;color:#bac8d0;line-height:1.5}
.mechList li:last-child{border-bottom:0}
.mechList li b{color:#a8c4d0;font-family:"IBM Plex Mono",monospace}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,12,17,.97);backdrop-filter:blur(12px);border-bottom:1px solid #26313a}
.topgrid{max-width:1440px;margin:auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:.76rem}
.topLeft{display:flex;align-items:center;gap:16px}
.topRight{display:flex;align-items:center;gap:10px}
.confWrap{display:flex;align-items:center;gap:8px}
.confLabel{color:var(--muted);white-space:nowrap}
.confbar{width:120px;height:6px;background:#182028;border:1px solid #2d3b45;overflow:hidden}
.conffill{height:100%;background:linear-gradient(90deg,#5d6f75,#96b69a);transition:.45s}
.confPct{color:var(--green);font-weight:600}
.scoreLabel{color:var(--muted)}
.scoreVal{color:#c8d8e0;font-weight:600}
.streakLabel{color:#c1a16a}
.topBtn{background:#111b22;color:#c0cdd4;border:1px solid #2e3f4a;padding:6px 10px;border-radius:3px;font:500 .72rem "IBM Plex Mono",monospace;min-height:32px}
.topBtn:hover{border-color:#4a6070}

/* SHELL / MONITOR */
.shell{min-height:100vh;padding:14px}
.monitor{max-width:1440px;margin:0 auto;border:1px solid #2c3943;background:#0a0e13;box-shadow:0 25px 80px var(--shadow)}
.monitorTop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid #26313a;background:#0b1117;font-family:"IBM Plex Mono",monospace;font-size:.76rem;flex-wrap:wrap}
.caseTitle{color:#bac6cc;font-weight:600}.clockLabel{color:#8ea0ab;text-align:center}

/* DESKTOP LAYOUT */
.desktop{display:grid;grid-template-columns:210px minmax(0,1fr) 320px;min-height:720px}
.explorer{border-right:1px solid var(--line);background:#0b1117;padding:10px}
.sectionLabel{font:600 .66rem "IBM Plex Mono",monospace;color:#71808b;text-transform:uppercase;letter-spacing:.12em;margin:10px 0 8px}
.folder{width:100%;display:flex;align-items:center;gap:7px;text-align:left;background:transparent;border:1px solid transparent;color:#7a8790;padding:7px 6px;border-radius:3px;margin:1px 0;font-size:.75rem;min-height:32px}
.folder.active{background:#121b23;border-color:#31404c;color:#d7e1e6}
.folder.done{color:#9fb7a0}.folder.locked{opacity:.5}
.folder:hover:not(.locked){background:#101820}

/* MAIN AREA */
.main{min-width:0;background:linear-gradient(rgba(255,255,255,.010) 50%,transparent 50%);background-size:100% 4px;padding:16px}
.workspace{max-width:820px;margin:0 auto}
.caseHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #24313b;padding-bottom:10px;margin-bottom:14px}
.caseKicker{font:600 .68rem "IBM Plex Mono",monospace;color:#8195a1;letter-spacing:.12em}
h2{font-size:1.35rem;margin:.15em 0}h3{margin:.3em 0;font-size:1rem}
.evidenceTag{font:600 .65rem "IBM Plex Mono",monospace;border:1px solid #40515c;color:#91a6b2;padding:5px 8px;border-radius:999px;white-space:nowrap}
.card{border:1px solid #26333d;background:#0e151c;padding:13px;margin:10px 0}
.cardTitle{font:600 .72rem "IBM Plex Mono",monospace;color:#99aab4;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.promptbox{font-family:"IBM Plex Mono",monospace;background:#080c10;border-left:3px solid #48697a;padding:10px;color:#adc4d0;margin:8px 0;font-size:.82rem}
.response{line-height:1.6;font-size:.88rem}

/* BUTTONS */
.option,.action,.trust,.finalChoice,.lensBtn{width:100%;text-align:left;background:#101821;color:#dce5ea;border:1px solid #2b3944;padding:10px 12px;margin:6px 0;border-radius:4px;transition:.18s;font-size:.88rem}
.option:hover,.action:hover,.trust:hover,.finalChoice:hover,.lensBtn:hover{border-color:#526773;background:#14202a}
.correct{border-color:#54745d!important;background:#102018!important}
.wrong{border-color:#82494a!important;background:#231414!important;animation:shake .28s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{border:1px solid #34424c;background:#0a1015;padding:12px;margin-top:10px;line-height:1.55;font-size:.87rem}
.feedback.good{border-color:#4e6b57}.feedback.bad{border-color:#74464a}

/* STRIKES */
.strikesRow{display:flex;gap:6px;margin-bottom:8px}
.strike{font-size:1rem;transition:.3s}.strike.lost{opacity:.2;filter:grayscale(1)}

/* COPILOT PANE */
.copilotPane{border-left:1px solid var(--line);background:#0b1117;display:flex;flex-direction:column;min-width:0}
.copHead{padding:10px 12px;border-bottom:1px solid #26323d;font:600 .72rem "IBM Plex Mono",monospace;color:#a5bec9;display:flex;align-items:center;gap:10px}
.copIcon{font-size:1.8rem;transition:filter 1.5s,opacity 1.5s}
.chat{padding:10px;overflow-y:auto;flex:1;max-height:600px}
.msg{margin:9px 0;line-height:1.55;font-size:.84rem}
.msg .who{font:600 .68rem "IBM Plex Mono",monospace;color:#7f96a4;display:block;margin-bottom:2px}
.msg.copilot{color:#cfdae0}.msg.detective{color:#aeb9c0}
.chatInput{border-top:1px solid #26323d;padding:9px}
.fakeInput{border:1px solid #33434e;background:#080d12;color:#75838c;padding:9px;font-family:"IBM Plex Mono",monospace;font-size:.75rem}

/* CASE BOARD */
.caseBoard{margin-top:12px;border-top:1px solid #2a3741;padding-top:10px}
.suspect{border:1px solid #27343e;padding:7px 9px;margin:6px 0;background:#0d141a;transition:border-color .5s,background .5s}
.suspect strong{display:flex;justify-content:space-between;gap:8px;font-size:.82rem}
.suspect.marcus.hot{border-color:#806c4a;background:#1b1710}
.suspect.lena.hot{border-color:#7b5050;background:#1b1214}
.suspect.revised{border-color:#4a7060!important;background:#0f1e18!important}
.suspectTag{font:600 .6rem "IBM Plex Mono",monospace;color:#8f9ca5;margin-top:4px}
.evidenceList{font-size:.74rem;color:#9aa8b1;line-height:1.6}

/* TABLE */
.table{width:100%;border-collapse:collapse;font-size:.78rem}
.table th,.table td{border:1px solid #2e3b45;padding:7px}.table th{background:#151d25}

/* DRAG */
.dragBank{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;min-height:44px}
.draggable{border:1px solid #364652;background:#121b22;padding:8px 10px;border-radius:4px;color:var(--text);font-size:.83rem;cursor:pointer;transition:.15s}
.draggable:hover{border-color:#4a6070}.draggable.selected{outline:2px solid #7d9a87;outline-offset:2px}
.dropZones{display:grid;gap:9px;margin:10px 0}
.drop{min-height:80px;border:1px dashed #44525e;padding:9px;background:#0c1319;border-radius:4px;transition:border-color .2s}
.drop.pulsing{border-color:#7d9a87;animation:dropPulse 1s infinite}
@keyframes dropPulse{50%{border-color:#96b69a}}
.drop b{display:block;font:600 .7rem "IBM Plex Mono",monospace;color:#8aa4b0;margin-bottom:6px;text-transform:uppercase}
.dropBody{display:flex;flex-wrap:wrap;gap:6px}

/* SEQUENCE */
.seqWrap{margin:10px 0}
.seqInner{display:grid;gap:6px}
.seqItem{display:grid;grid-template-columns:30px 1fr 80px;gap:8px;align-items:center;border:1px solid #2e3942;padding:7px 9px;background:#111820;border-radius:3px;font-size:.84rem}
.seqBtns{display:flex;gap:4px}
.mini{background:#15212a;color:#c7d4da;border:1px solid #3c4d58;padding:4px 8px;border-radius:3px;min-height:28px;font-size:.78rem}

/* BURNT FRAGMENTS */
.burntWrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.burnt{background:linear-gradient(135deg,transparent 0 3%,#18120f 3% 97%,transparent 97%),radial-gradient(circle at 20% 20%,#4c2b20,transparent 26%);border:1px solid #4c392f;padding:13px;min-height:100px;color:#cdbeb0;font-size:.83rem}

/* GRID2 / TRUST */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}

/* CASE UPDATE */
.caseUpdate{border-left:3px solid #869c8f;padding:10px;background:#10171a;margin:10px 0;font-size:.85rem}
.reveal{border:1px solid #6e4b4d;background:#181013;padding:14px;margin:10px 0;font-size:.85rem}

/* LOG LINES */
.logline{font-family:"IBM Plex Mono",monospace;font-size:.74rem;border-bottom:1px solid #22303a;padding:7px 0;cursor:pointer;transition:background .15s}
.logline:hover{background:#111a22}.logline.flagged{background:#1a2818;border-left:2px solid var(--green);padding-left:8px}
.logline.suspicious-line{background:#1a1810;border-left:2px solid var(--amber);padding-left:8px}

/* EVIDENCE LENS */
.lensWrap{border:1px solid #344959;background:#0b1520;padding:12px;margin:10px 0}
.lensTabs{display:flex;gap:6px;margin-bottom:10px}
.lensBtn{width:auto;padding:6px 12px;border-radius:3px;font:600 .7rem "IBM Plex Mono",monospace;letter-spacing:.06em}
.lensBtn.active{background:#1a2d3a;border-color:#5d8a9a;color:#a8d4c4}
.lensContent{font-size:.83rem;line-height:1.6;color:#bac8d4;font-family:"IBM Plex Mono",monospace}
.lensContent.hidden{display:none}

/* PROMPT BUILDER */
.spellBox{font-family:"IBM Plex Mono",monospace;background:#080c10;border:1px solid #2d4050;padding:12px;min-height:52px;color:#a8c4d0;margin:10px 0;border-radius:3px;font-size:.83rem;line-height:1.6}
.tileBank{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.tile{background:#141f28;color:#c0d0d8;border:1px solid #364858;padding:7px 10px;border-radius:3px;font-size:.82rem;transition:.15s}
.tile:hover{border-color:#4a6a7a}.tile.used{opacity:.25;pointer-events:none}
.tile.wrong-tile{border-color:#82494a;background:#231414;animation:shake .28s}

/* TWO-PATH */
.pathBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

/* FINAL GRID */
.finalGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tier{border:1px solid #34434e;background:#0e151b;padding:12px}
.tier h3{font:600 .7rem "IBM Plex Mono",monospace;color:#9caab3;margin-bottom:7px}
.tier p{font-size:.82rem;color:#9aa8b1;line-height:1.5;margin:0}

/* MODAL / BEAT */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:grid;place-items:center;padding:20px}
.modalCard{max-width:680px;width:100%;background:#0c1219;border:1px solid #2d3f4c;border-radius:6px;padding:26px;text-align:center}
.modalCard h2{font:600 1.4rem "IBM Plex Mono",monospace;color:#c0d4dc;margin-bottom:14px}
.beatLine{font-size:.88rem;color:#9ab0bc;line-height:1.7;margin:6px 0}
.beatLine b{color:#c1a16a}

/* MINI-GAME */
.miniTimer{font:700 2rem "IBM Plex Mono",monospace;color:var(--amber);text-align:center;margin:10px 0}
.miniFragment{border:1px solid #2d4050;background:#0c1520;padding:14px;margin:10px 0;text-align:center}
.fragmentTag{font:600 .68rem "IBM Plex Mono",monospace;padding:3px 8px;border-radius:999px;margin-bottom:8px;display:inline-block}
.tag-verified{background:#1a2e1a;color:#96b69a;border:1px solid #3d6a3d}
.tag-ai{background:#1a1e2e;color:#7f9eaf;border:1px solid #3d4a6a}
.tag-assumption{background:#2e2a1a;color:#c1a16a;border:1px solid #6a5a3d}
.tag-incomplete{background:#2a2020;color:#9a7070;border:1px solid #6a4a4a}
.fragmentText{font-size:.9rem;color:#c8d4da;line-height:1.5}
.keepDiscardBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.keepBtn{background:#0f2018;color:#96b69a;border:1px solid #3d6a3d;padding:10px;border-radius:4px}
.discardBtn{background:#201010;color:#a07070;border:1px solid #6a3a3a;padding:10px;border-radius:4px}
.miniScore{text-align:center;font:600 1.1rem "IBM Plex Mono",monospace;color:var(--amber);margin:10px 0}

.promptRepairBox{font-family:"IBM Plex Mono",monospace;background:#080c10;border:1px solid #2d4050;padding:12px;margin:10px 0;font-size:.85rem;line-height:1.8}
.brokenEl{color:#c17a7a;background:#2a1414;border:1px solid #6a3a3a;padding:1px 4px;border-radius:2px;cursor:default}

.verdictBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.verdictBtn{padding:10px;border-radius:4px;font:600 .75rem "IBM Plex Mono",monospace;letter-spacing:.05em}
.vbtn-proven{background:#0f1e2e;color:#7f9eaf;border:1px solid #3d5a7a}
.vbtn-supported{background:#1e1a0f;color:#c1a16a;border:1px solid #7a6a3d}
.vbtn-unresolved{background:#1e0f10;color:#a07070;border:1px solid #7a3a3a}
.verdictResult{font:400 .78rem "IBM Plex Mono",monospace;margin:3px 0;padding:5px 8px;border-radius:3px}
.verdict-correct{background:#0f2018;border-left:2px solid var(--green)}
.verdict-wrong{background:#201010;border-left:2px solid var(--red)}

/* END SCREEN */
.endHero{text-align:center;padding:32px 16px 20px}
.rankTitle{font:700 1.6rem "IBM Plex Mono",monospace;color:var(--amber);margin:12px 0}
.statsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:700px;margin:16px auto}
.stat{border:1px solid #2a3741;background:#0e151c;padding:14px;text-align:center}
.statVal{font:700 1.4rem "IBM Plex Mono",monospace;color:#a8c4d0}
.statLabel{font:400 .72rem "IBM Plex Mono",monospace;color:var(--muted);margin-top:4px}
.reviewCard{border:1px solid #2a3741;background:#0d1419;margin:8px 0;overflow:hidden}
.reviewCard.missed{border-color:#6a4a2a}
.reviewHead{width:100%;text-align:left;background:#111820;color:var(--text);border:0;padding:11px 13px;font-size:.85rem;cursor:pointer}
.reviewBody{padding:12px;font-size:.83rem;line-height:1.6;color:#9aa8b1;display:none}
.reviewBody.open{display:block}
.miniReplayBtns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}

/* TUTORIAL */
.tutorialGuide{border:1px solid #30404b;background:#0d151c;padding:12px;margin:10px 0;line-height:1.7;font-size:.87rem}
.tutorialGuide b{color:#b8c9d2}
.practiceBadge{display:inline-block;font:600 .63rem "IBM Plex Mono",monospace;color:#9fb9a8;border:1px solid #4a6552;background:#0d1a12;padding:4px 7px;margin-bottom:8px}
.practiceBoard{border-top:1px solid #2a3741;margin-top:12px;padding-top:10px}
.practiceEvidence{font-size:.74rem;color:#8e9ba4;line-height:1.6}
.practiceEvidence.verified{color:#a7bea9}
.skipTutorial{background:transparent;color:#92a0aa;border:1px solid #34434e;padding:9px 14px;border-radius:3px;font-size:.82rem}

/* RESPONSIVE */
@media(max-width:1100px){.desktop{grid-template-columns:180px minmax(0,1fr)}.copilotPane{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.chat{max-height:none}}
@media(max-width:760px){.desktop{grid-template-columns:1fr}.explorer{border-right:0;border-bottom:1px solid var(--line)}.grid2,.burntWrap,.finalGrid,.charGrid,.statsGrid,.pathBtns{grid-template-columns:1fr}.dropZones{grid-template-columns:1fr!important}.caseHeader{flex-direction:column}.shell{padding:0}.monitor{border-left:0;border-right:0}.topgrid{gap:6px}.confbar{width:80px}}
</style>
</head>
<body>
<div id="topbarEl" class="topbar hidden">
  <div class="topgrid">
    <div class="topLeft">
      <div class="confWrap">
        <span class="confLabel">CASE CONFIDENCE</span>
        <div class="confbar"><div id="confFill" class="conffill" style="width:8%"></div></div>
        <span id="confPct" class="confPct">8%</span>
      </div>
      <span class="scoreLabel">SCORE <span id="scoreEl" class="scoreVal">0</span></span>
      <span class="streakLabel">🔥 <span id="streakEl">0</span></span>
    </div>
    <div class="topRight">
      <button class="topBtn" onclick="openCaseLog()">📋 CASE LOG</button>
      <button class="topBtn" id="muteBtn" onclick="toggleMute()">🔊</button>
    </div>
  </div>
</div>
<div id="app"></div>
<div id="modalHost"></div>
<script>
const COPYRIGHT="© Dr. Amir Fard Bahreini";
const folders=["INCIDENT_REPORT","ACCESS_LOGS","PERSONNEL_FILES","EMAIL_ARCHIVE","TRANSFER_HISTORY","FINANCIAL_RECORDS","SERVER_LOGS","DEVICE_INVENTORY","DELETED_FILES","SECURITY_FOOTAGE","OFFSITE_BACKUP","CASE_BOARD","FINAL_REPORT"];

let S={
  idx:0,score:0,wrong:0,verified:0,streak:0,longestStreak:0,
  firstTry:0,strikesLeft:3,firstTryPerFolder:new Array(13).fill(null),
  wrongPerFolder:new Array(13).fill(0),
  selected:null,seq:null,
  marcusHeat:0,lenaHeat:0,marcusRevised:false,
  evidence:[],
  chat:[
    ["copilot","I have partial access to the surviving data."],
    ["copilot","Marcus Vale appears repeatedly in the recovered fragments."],
    ["copilot","If I were required to nominate a suspect immediately, I would nominate Marcus Vale."],
    ["copilot","You did not ask me to do that. I considered it efficient."]
  ],
  miniScores:[0,0,0],
  miniReplaying:false,
  pathTaken:null,
  answers:new Array(13).fill(null),
  mute:localStorage.getItem('ashesMute')==='1'
};

// AUDIO
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function sound(kind){
  if(S.mute)return;
  try{
    const a=getAudio();
    const notes=kind==='wrong'?[[220,.3]]:kind==='ok'?[[523,.15],[659,.15]]:kind==='verified'?[[523,.2],[659,.2],[784,.2]]:[[392,.3],[523,.3],[659,.3],[784,.5]];
    notes.forEach((n,j)=>{
      const o=a.createOscillator(),g=a.createGain();
      const st=a.currentTime+j*(kind==='wrong'?0:.16);
      o.frequency.value=n[0];o.type='sine';
      g.gain.setValueAtTime(.07,st);g.gain.exponentialRampToValueAtTime(.001,st+n[1]);
      o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+n[1]+.05);
    });
  }catch(e){}
}

  document.querySelectorAll('.drop[data-kind="final"]').forEach(z=>{

      if(correctMap[el.dataset.id]!==z.dataset.zone){allOk=false;bad.push(el);}
    });
  });
  if(!allOk){
    bad.forEach(el=>{el.classList.add('wrong');setTimeout(()=>{el.classList.remove('wrong');document.getElementById('finalBank').appendChild(el);},600);});
    wrong(null,'Some claims are in the wrong tier. Proven means directly verified by a source document. Supported means strongly indicated. Unresolved means the evidence does not yet answer the question.');
    return;
  }
  // show final question
  document.getElementById('finalQuestion').classList.remove('hidden');
  document.getElementById('checkFinalBtn').disabled=true;
}

function m1ShowNext(){

function m1Answer(kept){
  const f=window.m1Frags[m1State.idx];
  const correct=(kept===f.keep);

  const fb=document.getElementById('m1Feedback');
  if(fb){
    if(!correct&&kept&&!f.keep)fb.textContent='✦ Copilot: You kept '+({ASSUMPTION:'an assumption','AI-GENERATED':'an AI-generated finding','INCOMPLETE':'an incomplete finding'}[f.tag]||'something unverified')+'. I do this constantly. It is less charming than it sounds.';
    else if(!correct&&!kept&&f.keep)fb.textContent='✦ Copilot: That was source-verified. I am mildly offended on its behalf.';

}

  document.getElementById('practiceEvidence').classList.add('verified');
