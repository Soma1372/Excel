<style>
:root{--bg:#090d12;--panel:#0f151c;--line:#26323d;--text:#d8e1e8;--muted:#7f8d99;--green:#96b69a;--amber:#c1a16a;--red:#8f4848;--blue:#7f9eaf;--shadow:rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05080b;color:var(--text);font-family:Inter,Arial,sans-serif}body{background:radial-gradient(circle at 20% 0%,rgba(55,73,87,.16),transparent 30%),linear-gradient(180deg,#080c11,#05070a 72%)}button{font:inherit;cursor:pointer}.hidden{display:none!important}#app{min-height:100vh}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(255,255,255,.015) 50%,transparent 50%);background-size:100% 4px}.bootbox{width:min(760px,100%);border:1px solid #293540;background:#070b0f;padding:22px;box-shadow:0 20px 60px #000;font-family:"IBM Plex Mono",monospace}.bootline{opacity:0;transform:translateY(4px);transition:.35s;margin:7px 0;color:#9fb1bd}.bootline.show{opacity:1;transform:none}.bootline.alert{color:#c19a75}.bootline.cop{color:#b8d3c1}.bootBtn{margin-top:20px;background:#111b22;color:#d9e4ea;border:1px solid #3a4a56;padding:11px 14px;border-radius:4px}
.shell{min-height:100vh;padding:18px}.monitor{max-width:1440px;margin:0 auto;border:1px solid #2c3943;background:#0a0e13;box-shadow:0 25px 80px var(--shadow)}.monitorTop{display:grid;grid-template-columns:1.1fr .8fr .8fr;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid #26313a;background:#0b1117;font-family:"IBM Plex Mono",monospace;font-size:.78rem}.caseTitle{color:#bac6cc}.clock{text-align:center;color:#8ea0ab}.confidence{text-align:right}.confbar{height:7px;background:#182028;border:1px solid #2d3b45;margin-top:4px;overflow:hidden}.conffill{height:100%;background:linear-gradient(90deg,#5d6f75,#96b69a);transition:.45s}
.desktop{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;min-height:760px}.explorer{border-right:1px solid var(--line);background:#0b1117;padding:12px}.sectionLabel{font:600 .68rem "IBM Plex Mono",monospace;color:#71808b;text-transform:uppercase;letter-spacing:.12em;margin:8px 0 9px}.folder{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:1px solid transparent;color:#7a8790;padding:8px 7px;border-radius:4px;margin:2px 0;font-size:.78rem}.folder.active{background:#121b23;border-color:#31404c;color:#d7e1e6}.folder.done{color:#9fb7a0}.folder.locked{opacity:.55}.folder:hover{background:#101820}
.main{min-width:0;background:linear-gradient(rgba(255,255,255,.012) 50%,transparent 50%);background-size:100% 4px;padding:18px}.workspace{max-width:860px;margin:0 auto}.caseHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #24313b;padding-bottom:12px;margin-bottom:16px}.caseKicker{font:600 .7rem "IBM Plex Mono",monospace;color:#8195a1;letter-spacing:.12em}h1,h2,h3{margin:.2em 0}.caseHeader h2{font-size:1.45rem}.evidenceTag{font:600 .68rem "IBM Plex Mono",monospace;border:1px solid #40515c;color:#91a6b2;padding:6px 8px;border-radius:999px;white-space:nowrap}.card{border:1px solid #26333d;background:#0e151c;padding:14px;margin:12px 0}.cardTitle{font:600 .75rem "IBM Plex Mono",monospace;color:#99aab4;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}.promptbox{font-family:"IBM Plex Mono",monospace;background:#080c10;border-left:3px solid #48697a;padding:11px;color:#adc4d0;margin:8px 0}.response{line-height:1.6}
.option,.action,.trust,.finalChoice{width:100%;text-align:left;background:#101821;color:#dce5ea;border:1px solid #2b3944;padding:11px 12px;margin:7px 0;border-radius:5px;transition:.18s}.option:hover,.action:hover,.trust:hover,.finalChoice:hover{border-color:#526773;background:#14202a}.correct{border-color:#54745d!important;background:#102018!important}.wrong{border-color:#82494a!important;background:#231414!important;animation:shake .28s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.feedback{border:1px solid #34424c;background:#0a1015;padding:12px;margin-top:12px;line-height:1.55}.feedback.good{border-color:#4e6b57}.feedback.bad{border-color:#74464a}
.copilotPane{border-left:1px solid var(--line);background:#0b1117;display:flex;flex-direction:column;min-width:0}.copHead{padding:12px;border-bottom:1px solid #26323d;font:600 .75rem "IBM Plex Mono",monospace;color:#a5bec9}.chat{padding:12px;overflow:auto;flex:1;max-height:680px}.msg{margin:10px 0;line-height:1.55;font-size:.86rem}.msg .who{font:600 .7rem "IBM Plex Mono",monospace;color:#7f96a4;display:block;margin-bottom:3px}.msg.copilot{color:#cfdae0}.msg.detective{color:#aeb9c0}.chatInput{border-top:1px solid #26323d;padding:10px}.fakeInput{border:1px solid #33434e;background:#080d12;color:#75838c;padding:10px;font-family:"IBM Plex Mono",monospace;font-size:.78rem}
.caseBoard{margin-top:14px;border-top:1px solid #2a3741;padding-top:10px}.suspect{border:1px solid #27343e;padding:8px;margin:7px 0;background:#0d141a}.suspect strong{display:flex;justify-content:space-between;gap:8px}.suspect.marcus.hot{border-color:#806c4a;background:#1b1710}.suspect.lena.hot{border-color:#7b5050;background:#1b1214}.suspectTag{font:600 .62rem "IBM Plex Mono",monospace;color:#8f9ca5;margin-top:5px}.evidenceList{font-size:.76rem;color:#9aa8b1;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{width:100%;border-collapse:collapse;font-size:.78rem}.table th,.table td{border:1px solid #2e3b45;padding:8px}.table th{background:#151d25}.burntWrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}.burnt{background:linear-gradient(135deg,transparent 0 3%,#18120f 3% 97%,transparent 97%),radial-gradient(circle at 20% 20%,#4c2b20,transparent 26%);border:1px solid #4c392f;padding:14px;min-height:120px;color:#cdbeb0}.seq{display:grid;gap:7px}.seqItem{display:grid;grid-template-columns:34px 1fr 88px;gap:8px;align-items:center;border:1px solid #2e3942;padding:8px;background:#111820}.mini{background:#15212a;color:#c7d4da;border:1px solid #3c4d58;padding:5px 8px}.dropgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.drop{min-height:92px;border:1px dashed #44525e;padding:9px;background:#0c1319}.draggable{border:1px solid #364652;background:#121b22;padding:9px;margin:6px 0;width:100%;text-align:left;color:var(--text)}.draggable.selected{outline:2px solid #7d9a87}.logline{font-family:"IBM Plex Mono",monospace;font-size:.75rem;border-bottom:1px solid #22303a;padding:8px 0}.caseUpdate{border-left:3px solid #869c8f;padding:10px;background:#10171a;margin:12px 0}.reveal{border:1px solid #6e4b4d;background:#181013;padding:15px}.finalGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tier{border:1px solid #34434e;background:#0e151b;padding:12px}.tier h3{font:600 .72rem "IBM Plex Mono",monospace;color:#9caab3}.footer{text-align:center;color:#56646d;font-size:.7rem;padding:16px}

.tutorialGuide{border:1px solid #30404b;background:#0d151c;padding:12px;margin:10px 0;line-height:1.6}
.tutorialGuide b{color:#b8c9d2}
.practiceBadge{display:inline-block;font:600 .65rem "IBM Plex Mono",monospace;color:#9fb9a8;border:1px solid #4a6552;background:#0d1a12;padding:5px 7px;margin-bottom:8px}
.tutorialActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.skipTutorial{background:transparent;color:#92a0aa;border:1px solid #34434e;padding:10px 12px;border-radius:4px}
.practiceBoard{border-top:1px solid #2a3741;margin-top:14px;padding-top:10px}

@media(max-width:1100px){.desktop{grid-template-columns:190px minmax(0,1fr)}.copilotPane{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.chat{max-height:none}}@media(max-width:760px){.monitorTop{grid-template-columns:1fr}.clock,.confidence{text-align:left}.desktop{grid-template-columns:1fr}.explorer{border-right:0;border-bottom:1px solid var(--line)}.grid2,.burntWrap,.dropgrid,.finalGrid{grid-template-columns:1fr}.caseHeader{flex-direction:column}.shell{padding:0}.monitor{border-left:0;border-right:0}}
</style>

<body><div id="app"></div>
<script>
const COPYRIGHT="© Dr. Amir Fard Bahreini";
const folders=["INCIDENT_REPORT","ACCESS_LOGS","PERSONNEL_FILES","EMAIL_ARCHIVE","TRANSFER_HISTORY","FINANCIAL_RECORDS","SERVER_LOGS","DEVICE_INVENTORY","DELETED_FILES","SECURITY_FOOTAGE","OFFSITE_BACKUP","CASE_BOARD","FINAL_REPORT"];
const S={idx:0,score:0,wrong:0,verified:0,selected:null,seq:null,marcusHeat:0,lenaHeat:0,marcusRevised:false,evidence:[],chat:[["copilot","I have partial access to the surviving data."],["copilot","Marcus Vale appears repeatedly in the recovered fragments."],["copilot","If I were required to nominate a suspect immediately, I would nominate Marcus Vale."],["copilot","You did not ask me to do that. I considered it efficient."]]};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function boot(){document.getElementById("app").innerHTML=`<div class="boot"><div class="bootbox"><div id="b1" class="bootline">02:13:07 &nbsp; EVIDENCE ROOM 4</div><div id="b2" class="bootline">CASE 0417 — DATA THEFT / FIRE / SERVER WIPE</div><div id="b3" class="bootline">SYSTEM RECOVERY...</div><div id="b4" class="bootline">1 DEVICE FOUND</div><div id="b5" class="bootline alert">SURVIVING WORKSTATION: TERMINAL-04</div><div id="b6" class="bootline cop">✦ Copilot: Hello.</div><div id="b7" class="bootline cop">✦ Copilot: Marcus Vale appears unusually often in the surviving evidence.</div><div id="b8" class="bootline cop">✦ Copilot: This may be relevant. Or merely suspicious-looking. Those are not the same thing.</div><button id="bootBtn" class="bootBtn hidden" onclick="showTutorial()">OPEN CASE TERMINAL</button></div></div>`;["b1","b2","b3","b4","b5","b6","b7","b8"].forEach((id,i)=>setTimeout(()=>document.getElementById(id).classList.add("show"),350+i*430));setTimeout(()=>document.getElementById("bootBtn").classList.remove("hidden"),4200)}
function confidence(){return Math.min(96,8+S.verified*7)}function folderState(i){if(i<S.idx)return"done";if(i===S.idx)return"active";return"locked"}
function boardHTML(){const mtag=S.marcusRevised?"EVIDENCE VALID · INTERPRETATION REVISED":S.marcusHeat>=5?"PRIMARY SUSPECT (PROVISIONAL)":S.marcusHeat>=2?"EVIDENCE ACCUMULATING":"UNDER REVIEW";const ltag=S.lenaHeat>=2?"DEVICE LINK CONFIRMED":S.lenaHeat?"NEW LEAD":"UNDER REVIEW";return `<div class="caseBoard"><div class="sectionLabel">Case Board</div><div class="suspect marcus ${S.marcusHeat>=2?"hot":""}"><strong><span>MARCUS VALE</span><span>${S.marcusHeat>=5?"●":""}</span></strong><div class="suspectTag">${mtag}</div></div><div class="suspect lena ${S.lenaHeat>=2?"hot":""}"><strong><span>LENA ORTIZ</span><span>${S.lenaHeat>=2?"●":""}</span></strong><div class="suspectTag">${ltag}</div></div><div class="suspect"><strong>DANIEL KERR</strong><div class="suspectTag">LOW PRIORITY</div></div><div class="sectionLabel" style="margin-top:12px">Known</div><div class="evidenceList">${S.evidence.length?S.evidence.map(x=>"• "+esc(x)).join("<br>"):"No verified evidence yet."}</div></div>`}
function chatHTML(){return S.chat.map(m=>`<div class="msg ${m[0]}"><span class="who">${m[0]==="copilot"?"✦ COPILOT":"DETECTIVE"}</span>${m[1]}</div>`).join("")}
function addChat(who,text){S.chat.push([who,text]);const c=document.querySelector(".chat");if(c){c.innerHTML=chatHTML()+boardHTML();c.scrollTop=c.scrollHeight}}
function evidence(name){if(!S.evidence.includes(name))S.evidence.push(name)}

function showTutorial(){
 document.getElementById("app").innerHTML=`<div class="shell"><div class="monitor">
  <div class="monitorTop">
   <div class="caseTitle">CASE TERMINAL / ORIENTATION CACHE</div>
   <div class="clock">02:13 AM · TRAINING MODE</div>
   <div class="confidence">CASE CONFIDENCE — PRACTICE<div class="confbar"><div id="practiceConf" class="conffill" style="width:8%"></div></div></div>
  </div>
  <div class="desktop">
   <aside class="explorer">
    <div class="sectionLabel">Recovered Folders</div>
    <button class="folder active">📂 TRAINING_CACHE</button>
    ${folders.map(f=>`<button class="folder locked">🔒 ${f}</button>`).join("")}
   </aside>
   <main class="main"><div class="workspace">
    <div class="caseHeader">
     <div><div class="caseKicker">ZERO-STAKES ORIENTATION</div><h2>HOW TO WORK THE TERMINAL</h2></div>
     <div class="evidenceTag">PRACTICE ONLY</div>
    </div>
    <div class="tutorialGuide">
     <b>1. Open the active evidence folder.</b> Locked folders become available as the investigation progresses.<br>
     <b>2. Ask what the evidence actually proves.</b> Copilot can analyze it. You decide what the result means.<br>
     <b>3. Verify before promoting a finding.</b> Verified evidence increases Case Confidence and appears on the Case Board.<br>
     <b>4. Wrong answers are not fatal.</b> You get feedback and try again. This practice question does not affect the case.
    </div>
    <div class="card">
     <div class="practiceBadge">PRACTICE EVIDENCE</div>
     <div class="cardTitle">Recovered Door Log</div>
     <div class="promptbox">02:04:12 — RECORDS_ROOM_DOOR — OPENED</div>
     <div class="response">✦ Copilot: The records-room door opened at 02:04:12.<br><br>I can also speculate wildly, but you should probably stop me.</div>
    </div>
    <div class="card">
     <div class="cardTitle">What can you safely add to the Case Board?</div>
     <button class="option" onclick="tutorialAnswer(this,0)">Marcus Vale stole the dataset.</button>
     <button class="option" onclick="tutorialAnswer(this,1)">The records-room door opened at 02:04:12.</button>
     <button class="option" onclick="tutorialAnswer(this,2)">The fire started at 02:04:12.</button>
     <button class="option" onclick="tutorialAnswer(this,3)">Whoever opened the door caused the fire.</button>
     <div id="tutorialFeedback"></div>
    </div>
    <div class="tutorialActions">
     <button class="skipTutorial" onclick="finishTutorial()">SKIP TUTORIAL</button>
    </div>
   </div></main>
   <aside class="copilotPane">
    <div class="copHead">✦ COPILOT / ORIENTATION SESSION</div>
    <div class="chat">
     <div class="msg copilot"><span class="who">✦ COPILOT</span>Before we begin: I can find patterns, summarize evidence, and occasionally sound more certain than the evidence deserves.</div>
     <div class="msg copilot"><span class="who">✦ COPILOT</span>Your job is the inconvenient part: deciding what is actually supported.</div>
     <div class="practiceBoard">
      <div class="sectionLabel">Practice Case Board</div>
      <div id="practiceEvidence" class="practiceEvidence">No verified practice evidence yet.</div>
     </div>
    </div>
    <div class="chatInput"><div class="fakeInput">&gt; Practice session</div></div>
   </aside>
  </div>
  <div class="footer">${COPYRIGHT}</div>
 </div></div>`;
 window.scrollTo({top:0,behavior:"smooth"})
}
function tutorialAnswer(btn,choice){
 const box=document.getElementById("tutorialFeedback");
 if(choice!==1){
   btn.classList.add("wrong");
   setTimeout(()=>btn.classList.remove("wrong"),500);
   const lines=[
    "That claim exceeds the evidence. Marcus has not even entered the tutorial and is already being blamed.",
    "",
    "A door opening and a fire starting are two different events. Chronology is not causation.",
    "That is an interpretation, not a verified fact. The distinction will become irritatingly important."
   ];
   box.innerHTML=`<div class="feedback bad">✦ Copilot: ${lines[choice]}<br><br>This is practice. I will not put it in your permanent record. I do not have a permanent record.</div>`;
   return;
 }
 document.querySelectorAll(".option").forEach(x=>x.disabled=true);
 btn.classList.add("correct");
 document.getElementById("practiceConf").style.width="32%";
 const pe=document.getElementById("practiceEvidence");
 pe.classList.add("verified");
 pe.innerHTML="✓ 02:04:12 — Records-room door opened <span style='color:#73818a'>(SOURCE VERIFIED)</span>";
 box.innerHTML=`<div class="feedback good"><b>Verified.</b> You added only what the evidence proves.<br><br>✦ Copilot: Excellent. You have resisted narrative inflation for one full question.<br><button class="action" style="margin-top:10px" onclick="finishTutorial()">BEGIN INVESTIGATION →</button></div>`;
}
function finishTutorial(){
 renderGame();
}

function renderGame(){document.getElementById("app").innerHTML=`<div class="shell"><div class="monitor"><div class="monitorTop"><div class="caseTitle">CASE 0417 / SURVIVING TERMINAL</div><div class="clock">02:13 AM · EVIDENCE ROOM 4</div><div class="confidence">CASE CONFIDENCE ${confidence()}%<div class="confbar"><div class="conffill" style="width:${confidence()}%"></div></div></div></div><div class="desktop"><aside class="explorer"><div class="sectionLabel">Recovered Folders</div>${folders.map((f,i)=>`<button class="folder ${folderState(i)}" onclick="folderClick(${i})">${i<=S.idx?"📂":"🔒"} ${f}</button>`).join("")}</aside><main class="main"><div class="workspace">${renderQuestion()}</div></main><aside class="copilotPane"><div class="copHead">✦ COPILOT / SURVIVING SESSION</div><div class="chat">${chatHTML()}${boardHTML()}</div><div class="chatInput"><div class="fakeInput">&gt; Ask about the case...</div></div></aside></div><div class="footer">${COPYRIGHT}</div></div></div>`}
function folderClick(i){if(i>S.idx){addChat("copilot","That folder is still locked. I admire the optimism.");return}if(i<S.idx){addChat("copilot","You have already processed that evidence. Reopening it will not make it more dramatic.")}}
function header(title,tag,body){return `<div class="caseHeader"><div><div class="caseKicker">EVIDENCE ${String(S.idx+1).padStart(2,"0")} OF 13</div><h2>${title}</h2></div><div class="evidenceTag">${tag}</div></div>${body}`}
function copilot(prompt,response){return `<div class="card"><div class="cardTitle">✦ Copilot</div><div class="promptbox">${esc(prompt)}</div><div class="response">${response}</div></div>`}
function choices(items,correct,cb="answerMC"){return items.map((x,i)=>`<button class="option" onclick="${cb}(this,${i},${correct})">${esc(x)}</button>`).join("")}
function finish(feedback,chatLine,evidenceLine,heatM=0,heatL=0){S.verified++;S.score+=100;S.marcusHeat+=heatM;S.lenaHeat+=heatL;if(evidenceLine)evidence(evidenceLine);addChat("copilot",chatLine);const h=document.getElementById("feedback");if(h)h.innerHTML=`<div class="feedback good">${feedback}<br><button class="action" style="margin-top:10px" onclick="next()">ADD TO CASE BOARD →</button></div>`}
function wrong(btn,text){S.wrong++;if(btn){btn.classList.add("wrong");setTimeout(()=>btn.classList.remove("wrong"),500)}const h=document.getElementById("feedback");if(h)h.innerHTML=`<div class="feedback bad">${text}</div>`;addChat("copilot",text)}
function next(){if(S.idx<12){S.idx++;renderGame()}else renderFinale()}
function answerMC(btn,i,c){const q=S.idx;if(i!==c){const lines=["A confident answer is not the same as a complete one.","You have still not defined suspicious. I can guess. You should not ask me to.","The names look similar to you. Exact text does not share your social instincts.","Transparency is evidence too.","You are allowing me to invent the rule. I appreciate the freedom. You should not.","Order matters when reconstructing evidence.","If you ask me to verify myself, you have created a very small committee of one.","Tool choice is part of verification.","A sensitivity analysis with undefined ranges is merely three moods.","Standard formulas calculate values. They do not read meaning in sentences.","Narrative is downstream of verified numbers.","The evidence was real. The conclusion exceeded what it proved.","Approximations do not become prosecutable because they are written in paragraphs."];wrong(btn,lines[q]);return}btn.classList.add("correct");if(q===0)finish("Correct. Copilot reached a conclusion from incomplete surviving evidence.","You noticed the missing context. Good. Marcus remains suspicious. Suspicion remains insufficient.","Surviving file structure incomplete",2,0);if(q===1)finish("Correct. Define the business rule before asking Copilot to classify behavior.","You have defined suspicious before asking me to detect it. This is less exciting and more useful.","Suspicious-access rule explicitly defined",1,0);if(q===2)finish("Correct. Inconsistent name formatting split Marcus into multiple categories.","Marcus Vale, MARCUS VALE, and M. Vale are apparently three people if the data insists they are.","Marcus login count corrected from 4 to 7",2,0);if(q===6)finish("Correct. Independent verification means writing a confirming formula.","You are checking my work. I find this appropriate.","Server-wipe timestamp independently verified",1,0);if(q===9)finish("Correct. This is semantic classification of unstructured text, not a fixed numeric calculation.","I remain concerned about the vending machine incident, but I agree it is not evidence of data theft.","Guard observations classified by meaning",0,0);if(q===11){S.marcusRevised=true;finish("Correct. Copilot's evidence about Marcus was valid. Its interpretation exceeded what the evidence proved.","I need to revise my conclusion. Marcus accessed restricted files. Lena Ortiz transferred the dataset. These are different statements.","Marcus evidence retained; interpretation revised",0,3)}}
function renderQuestion(){const fb=`<div id="feedback"></div>`;switch(S.idx){
case 0:return header("INCIDENT REPORT","INCOMPLETE EVIDENCE",`${copilot("Summarize the surviving file structure.","Recovered fragments repeatedly reference Marcus Vale. Based on the surviving data, Marcus Vale is the most likely suspect.")}<div class="card"><div class="cardTitle">Detective's Question</div><h3>What is missing from Copilot's conclusion?</h3>${choices(["It used incomplete data","It named the wrong column","It excluded all blanks","It used the wrong time range"],0)}${fb}</div>`);
case 1:return header("ACCESS LOGS","RULE DEFINITION",`${copilot("Who accessed the most suspicious files?","Before I answer: what do you mean by suspicious?")}${choices(["All users","Authorized users","Unauthorized users","I have not defined what suspicious means"],3)}${fb}`);
case 2:return header("PERSONNEL FILES","CATEGORY CONSISTENCY",`<div class="card"><div class="cardTitle">Recovered Names</div><table class="table"><tr><th>Log Name</th><th>Count</th></tr><tr><td>Marcus Vale</td><td>4</td></tr><tr><td>MARCUS VALE</td><td>2</td></tr><tr><td>M. Vale</td><td>1</td></tr></table></div><h3>Copilot reported 4 Marcus logins. The real count is 7. Why?</h3>${choices(["Inconsistent name formatting split one person into multiple categories","The time window was wrong","Copilot ignored weekends","The file was encrypted"],0)}${fb}`);
case 3:return header("EMAIL ARCHIVE","TRANSPARENCY",`<div class="grid2"><div class="card"><div class="cardTitle">SUMMARY A</div>Marcus appears connected to restricted-file activity.<br><br><button class="trust" onclick="trustQ4(this,false)">TRUST A</button></div><div class="card"><div class="cardTitle">SUMMARY B</div>Marcus appears connected to restricted-file activity.<br><small>3 unrecovered emails and 2 corrupted attachments excluded.</small><br><br><button class="trust" onclick="trustQ4(this,true)">TRUST B</button></div></div>${fb}`);
case 4:return header("TRANSFER HISTORY","HIDDEN ASSUMPTIONS",`${copilot("Flag all transfers that look suspicious.","I flagged 3 transfers.")}<div class="card"><div class="cardTitle">Sort each statement</div>${dragQ5()}<button class="action" onclick="checkQ5()">CHECK CLASSIFICATION</button>${fb}</div>`);
case 5:return header("FINANCIAL RECORDS","FORENSIC RECONSTRUCTION",`<div class="burntWrap"><div class="burnt"><b>FRAGMENT A</b><br>Q1–Q2 transaction extract<br>Edges burned. Workbook metadata intact.</div><div class="burnt"><b>FRAGMENT B</b><br>Q3–Q4 transaction extract<br>Period labels missing.</div></div><div class="card"><div class="cardTitle">Reassemble the workflow</div>${sequenceQ6()}<button class="action" onclick="checkSequence(6)">RECONSTRUCT</button>${fb}</div>`);
case 6:return header("SERVER LOGS","INDEPENDENT VERIFICATION",`${copilot("Build a timeline of the server wipe.","Server wipe initiated at 02:11:04. Confidence: high.")}<h3>Before presenting that timestamp, what should the detective do?</h3>${choices(["Write a confirming formula","Ask Copilot to recalculate","Trust it because it looks reasonable","Check an unrelated file"],0)}${fb}`);
case 7:return header("DEVICE INVENTORY","TOOL DECISION",`<div class="card"><div class="cardTitle">Assign the right tool</div>${dragQ8()}<button class="action" onclick="checkQ8()">CHECK TOOLS</button>${fb}</div>`);
case 8:return header("DELETED FILES","SENSITIVITY ANALYSIS",`${copilot("Show three scenarios for how the theft could have been executed.","Scenario A: Low transfer volume<br>Scenario B: Medium transfer volume<br>Scenario C: High transfer volume")}<div class="card"><div class="cardTitle">Spot the flaw</div><h3>What is missing?</h3>${choices(["The scenario variables and their actual values/ranges were never defined","The font is not monospace","The suspect names are missing","The files were recovered too quickly"],0,"answerQ9")}${fb}</div>`);
case 9:return header("SECURITY FOOTAGE","UNSTRUCTURED TEXT",`<div class="card"><div class="cardTitle">Guard Log — Recovered Text</div><div class="logline">01:48 — Delivery driver complained the vending machine ate $2.</div><div class="logline">01:51 — Guard noted rainwater near east entrance.</div><div class="logline">01:56 — Woman in grey coat near archive. Appeared nervous.</div><div class="logline">02:00 — Break-room microwave left running.</div><div class="logline">02:04 — Records-room access door opened.</div><div class="logline">02:07 — Smoke visible beneath records-room door.</div></div>${copilot("Classify each observation as Relevant, Neutral, or Irrelevant.","Classification complete.")}<h3>Why is Copilot better suited than a standard Excel formula?</h3>${choices(["It interprets meaning in unstructured text rather than only calculating structured values","It can see hidden rows","It automatically knows who is guilty","It ignores categories"],0)}${fb}`);
case 10:return header("OFFSITE BACKUP","VERIFY BEFORE NARRATIVE",`${copilot("Summarize the case for the report.","Marcus Vale is the most likely suspect based on restricted-file access, timing, and recovered activity.")}<div class="card"><div class="cardTitle">Assemble verification before narrative</div>${sequenceQ11()}<button class="action" onclick="checkSequence(11)">VERIFY SUMMARY</button>${fb}</div>`);
case 11:return header("CASE BOARD","INTERPRETATION REVISION",`<div class="reveal"><div class="cardTitle">NEW EVIDENCE — LENA ORTIZ DEVICE</div><b>01:52:18</b> — Offsite backup device initiated transfer of confidential dataset.<br><b>Device owner:</b> Lena Ortiz.<br><b>Transfer hash:</b> matches stolen dataset.</div><div class="caseUpdate"><b>Marcus evidence remains valid:</b> restricted-file access occurred.<br><b>But the meaning changes:</b> access is not the same as theft.</div><h3>What does this reveal about Copilot's earlier conclusion?</h3>${choices(["Its evidence was accurate, but its interpretation exceeded what the evidence proved","Its earlier evidence is now worthless","It deliberately excluded Lena","It hallucinated Marcus's access"],0)}${fb}`);
case 12:return header("FINAL REPORT","PROSECUTION STANDARD",`<div class="grid2"><div class="card"><div class="cardTitle">SUMMARY A</div>Lena Ortiz stole the dataset, burned the records room, and wiped the server. Copilot identifies her as responsible.</div><div class="card"><div class="cardTitle">SUMMARY B</div>Verified device logs strongly support that Lena Ortiz initiated the 1:52 dataset transfer. Separate evidence supports, but does not conclusively prove, her involvement in the server wipe. Responsibility for the fire remains unresolved.</div></div><h3>Which narrative belongs in the prosecution report?</h3><button class="trust" onclick="trustQ13(this,false)">SUMMARY A</button><button class="trust" onclick="trustQ13(this,true)">SUMMARY B</button>${fb}`)}}
function trustQ4(btn,ok){if(!ok){wrong(btn,"The conclusion is the same. The transparency is not.");return}btn.classList.add("correct");finish("Correct. The trustworthy summary tells you what was excluded.","A number or conclusion without provenance is merely dressed for court.","Email exclusions documented",2,0)}
function dragHTML(items,zones,id){return `<div id="${id}bank">${items.map((x,i)=>`<button class="draggable" data-id="${i}" onclick="selDrag(this,'${id}')">${esc(x[0])}</button>`).join("")}</div><div class="dropgrid">${zones.map(z=>`<div class="drop" data-zone="${z[0]}" onclick="dropTap(this,'${id}')"><b>${z[1]}</b><div class="dropbody"></div></div>`).join("")}</div>`}
function selDrag(el,id){document.querySelectorAll(".draggable").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");S.selected={el,id}}function dropTap(zone,id){if(!S.selected||S.selected.id!==id)return;zone.querySelector(".dropbody").appendChild(S.selected.el);S.selected.el.classList.remove("selected");S.selected=null}
function dragQ5(){window.q5=[["Transfer occurred after midnight","decided"],["Transfer exceeded 2 GB","specified"],["User lacked transfer authorization","specified"],["Repeated access looks unusual","decided"]];return dragHTML(window.q5,[["decided","COPILOT DECIDED"],["specified","DETECTIVE SHOULD SPECIFY"]],"q5")}
function checkQ5(){let ok=true;document.querySelectorAll('.drop[data-zone]').forEach(z=>z.querySelectorAll(".draggable").forEach(el=>{if(window.q5[+el.dataset.id][1]!==z.dataset.zone)ok=false}));if(document.getElementById("q5bank").children.length)ok=false;if(!ok){wrong(null,"Some of those rules still came from me rather than from you.");return}finish("Correct. The detective defines the rule; Copilot applies it.","I prefer explicit rules. They reduce my opportunities for accidental creativity.","Suspicious-transfer rule documented",1,0)}
function sequence(items,id){S.seq=items.slice().sort(()=>Math.random()-.5);return `<div id="${id}" class="seq">${S.seq.map((x,i)=>`<div class="seqItem"><b>${i+1}</b><span>${esc(x[0])}</span><span><button class="mini" onclick="moveSeq(${i},-1,'${id}')">↑</button><button class="mini" onclick="moveSeq(${i},1,'${id}')">↓</button></span></div>`).join("")}</div>`}
function sequenceQ6(){return sequence([["Orient each file",0],["Consolidate into one workbook",1],["Add a Period label column",2],["Analyze",3],["Synthesize",4]],"seq6")}function sequenceQ11(){return sequence([["Check the range",0],["Check the logic",1],["Sanity-check the result",2],["Verify one result manually",3],["Ask Copilot to explain",4]],"seq11")}
function moveSeq(i,d,id){const j=i+d;if(j<0||j>=S.seq.length)return;[S.seq[i],S.seq[j]]=[S.seq[j],S.seq[i]];document.getElementById(id).outerHTML=`<div id="${id}" class="seq">${S.seq.map((x,k)=>`<div class="seqItem"><b>${k+1}</b><span>${esc(x[0])}</span><span><button class="mini" onclick="moveSeq(${k},-1,'${id}')">↑</button><button class="mini" onclick="moveSeq(${k},1,'${id}')">↓</button></span></div>`).join("")}</div>`}
function checkSequence(q){const ok=S.seq.every((x,i)=>x[1]===i);if(!ok){wrong(null,q===6?"The fragments are in the wrong workflow order. Reconstruction before synthesis.":"The verification ladder is out of order.");return}if(q===6)finish("Correct. The burned fragments become one analyzable evidence set.","Manual consolidation first. Then analysis. Even I cannot merge workbooks by wishing at them.","Financial fragments reconstructed",1,0);else finish("Correct. The narrative can now sit on verified findings instead of replacing them.","I was prepared to write a very persuasive paragraph. Your insistence on evidence has delayed me.","Case narrative verified before reporting",2,0)}
function dragQ8(){window.q8=[["Summarize 40 free-text device notes","copilot"],["Confirm a timestamp calculation","formula"],["Inspect a physically damaged serial number","manual"],["Classify narrative device descriptions","copilot"],["Recalculate a transfer total","formula"]];return dragHTML(window.q8,[["copilot","COPILOT"],["formula","FORMULA"],["manual","MANUAL REVIEW"]],"q8")}
function checkQ8(){let ok=true;document.querySelectorAll('.drop[data-zone]').forEach(z=>z.querySelectorAll(".draggable").forEach(el=>{if(window.q8[+el.dataset.id][1]!==z.dataset.zone)ok=false}));if(document.getElementById("q8bank").children.length)ok=false;if(!ok){wrong(null,"One task is assigned to the wrong tool. Not every problem should be handed to me. I find this humbling.");return}finish("Correct. The best investigator chooses the right tool before choosing the answer.","A formula, a human, and I are not interchangeable. This is healthy.","Tool-selection framework applied",1,0)}
function answerQ9(btn,i,c){if(i!==c){wrong(btn,"'Low,' 'medium,' and 'high' are not ranges. They are adjectives wearing safety vests.");return}btn.classList.add("correct");finish("Correct. A sensitivity analysis needs named variables and defined values or ranges.","Apparently 'high' is not a recognized unit of data transfer. This is disappointing.","Sensitivity variables and ranges defined",1,0)}
function trustQ13(btn,ok){if(!ok){wrong(btn,"That summary claims the fire as fact. The evidence does not.");return}btn.classList.add("correct");finish("Correct. The report distinguishes what is proven from what is merely supported.","You have resisted the more dramatic sentence. I acknowledge the restraint.","Prosecution narrative limited to verified claims",0,2)}
function renderFinale(){renderGame();document.querySelector(".workspace").innerHTML=header("CASE CONCLUSION","FINAL EXAM",`<div class="finalGrid"><div class="tier"><h3>STRONGLY SUPPORTED</h3><p>Lena Ortiz's device initiated the confidential dataset transfer at 1:52 a.m.</p></div><div class="tier"><h3>SUPPORTED, NOT CONCLUSIVE</h3><p>Lena may have been involved in the 2:11 a.m. server wipe.</p></div><div class="tier"><h3>UNRESOLVED</h3><p>Who started the records-room fire, and whether it was deliberately connected to the theft.</p></div></div><div class="card"><div class="cardTitle">Would you present this as fact?</div><button class="finalChoice" onclick="finalAnswer(this,false)">Yes — Lena stole the data, burned the records room, and wiped the server.</button><button class="finalChoice" onclick="finalAnswer(this,true)">No — the theft is strongly supported, but the fire and full sequence of events remain partly unresolved.</button><div id="feedback"></div></div>`)}
function finalAnswer(btn,ok){if(!ok){wrong(btn,"That sentence exceeds the evidence. Courts, like spreadsheets, dislike unsupported joins.");return}btn.classList.add("correct");S.verified++;S.score+=150;S.lenaHeat+=2;evidence("Final report distinguishes proof from inference");addChat("copilot","That is inconveniently responsible. I was prepared to sound much more certain.");renderGame();document.querySelector(".workspace").innerHTML=header("CASE 0417","REFERRED FOR PROSECUTION",`<div class="card"><div class="cardTitle">Final Status</div><h2>Evidence verified. Interpretation constrained to what the record supports.</h2><p><b>Primary suspect for the theft:</b> Lena Ortiz</p><p><b>Fire responsibility:</b> unresolved</p><p><b>Server wipe:</b> supported, not conclusive</p><div class="feedback good">✦ Copilot: That is inconveniently responsible. I was prepared to sound much more certain.</div><div class="feedback">✦ Copilot: Detective?<br><br>There is one additional file.<br><br><b>CASE_0418</b><br>It is also on fire.</div><button class="action" onclick="location.reload()">CLOSE CASE</button></div>`)}
boot();
</script></body></html>
