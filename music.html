<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Conservatory Music History Placement Exam</title>

<style>
:root {
    --bg: #0f172a;
    --panel: #172033;
    --panel2: #1e293b;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #fb7185;
    --yellow: #facc15;
    --border: #334155;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: linear-gradient(180deg, #0b1120, var(--bg));
    color: var(--text);
    line-height: 1.55;
}

header {
    padding: 46px 20px 30px;
    text-align: center;
    border-bottom: 1px solid var(--border);
}

header h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.6rem);
}

header p {
    max-width: 850px;
    margin: 15px auto 0;
    color: var(--muted);
    font-size: 1.05rem;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 28px 20px 80px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

button,
select {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    padding: 11px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.95rem;
}

button:hover,
select:hover {
    border-color: var(--accent);
}

button.primary {
    background: var(--accent);
    color: #07111f;
    font-weight: 700;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
}

.stat {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 1.6rem;
    color: white;
}

.stat span {
    color: var(--muted);
    font-size: 0.86rem;
}

.tier-heading {
    margin-top: 35px;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
}

.tier-heading h2 {
    margin-bottom: 3px;
}

.tier-heading p {
    margin-top: 0;
    color: var(--muted);
}

.question {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 13px;
    margin-bottom: 17px;
}

.question.correct {
    border-color: var(--green);
}

.question.incorrect {
    border-color: var(--red);
}

.meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    background: #253148;
    color: #cbd5e1;
    font-size: 0.75rem;
}

.badge.t1 {
    color: #bfdbfe;
}

.badge.t2 {
    color: #ddd6fe;
}

.badge.t3 {
    color: #fde68a;
}

.qtext {
    font-size: 1.08rem;
    font-weight: 650;
    margin: 8px 0 13px;
}

.choice {
    padding: 9px 11px;
    margin: 7px 0;
    background: #111827;
    border: 1px solid #263449;
    border-radius: 8px;
}

.choice label {
    display: block;
    cursor: pointer;
}

.choice.correct-answer {
    border-color: var(--green);
    background: rgba(52, 211, 153, 0.09);
}

.choice.wrong-answer {
    border-color: var(--red);
    background: rgba(251, 113, 133, 0.08);
}

.explanation {
    display: none;
    margin-top: 13px;
    padding: 12px;
    border-left: 4px solid var(--accent2);
    background: #111827;
    color: #cbd5e1;
}

.explanation.show {
    display: block;
}

.scorebox {
    display: none;
    margin: 25px 0;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 12px;
}

.scorebox.show {
    display: block;
}

.scorebox h2 {
    margin-top: 0;
}

.hidden {
    display: none !important;
}

footer {
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--border);
    padding: 25px;
}

@media (max-width: 700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<div id="scorebox" class="scorebox"></div>

<div id="quiz"></div>

</main>

<footer>

const quiz = document.getElementById("quiz");
const tierFilter = document.getElementById("tierFilter");
const categoryFilter = document.getElementById("categoryFilter");

let questionOrder = questions.map((_, i) => i);

function visibleQuestions() {

    const tier = tierFilter.value;
    const cat = categoryFilter.value;

    return questionOrder.filter(index => {

        const q = questions[index];

        const tierOK =
            tier === "all" ||
            String(q.tier) === tier;

        const catOK =
            cat === "all" ||
            q.category === cat;

        return tierOK && catOK;
    });
}

function renderQuiz() {

    quiz.innerHTML = "";

    const visible = visibleQuestions();

    let currentTier = null;

    visible.forEach((index, displayIndex) => {

        const q = questions[index];

        if (tierFilter.value === "all" && q.tier !== currentTier) {

            currentTier = q.tier;

            const heading = document.createElement("div");
            heading.className = "tier-heading";

            const tierDescriptions = {
                1: "Essential recognition: genres, forms, composers, and core repertoire.",
                2: "Very likely placement material: opera structure, nationalism, harmony, and stylistic identification.",
                3: "Advanced placement material: Modernism, serialism, experimental music, politics, and analytical distinctions."
            };

            heading.innerHTML =
                `<h2>Tier ${q.tier}</h2>
                 <p>${tierDescriptions[q.tier]}</p>`;

            quiz.appendChild(heading);
        }

        const div = document.createElement("div");

        div.className = "question";
        div.dataset.index = index;

        const choices = q.choices.map((choice, choiceIndex) => `

            <div class="choice" data-choice="${choiceIndex}">
                <label>
                    <input
                        type="radio"
                        name="question-${index}"
                        value="${choiceIndex}"
                        onchange="updateAnswered()"
                    >
                    ${String.fromCharCode(97 + choiceIndex)}. ${choice}
                </label>
            </div>

        `).join("");

        div.innerHTML = `

            <div class="meta">
                <span class="badge t${q.tier}">Tier ${q.tier}</span>
                <span class="badge">${q.category}</span>
            </div>

            <div class="qtext">
                ${displayIndex + 1}. ${q.q}
            </div>

            ${choices}

            <div class="explanation">
                <strong>Correct answer:</strong>
                ${String.fromCharCode(97 + q.answer)}.
                ${q.choices[q.answer]}
                <br><br>
                <strong>Why:</strong>
                ${q.explanation}
            </div>
        `;

        quiz.appendChild(div);
    });

    document.getElementById("visibleCount").textContent = visible.length;

    updateAnswered();
}

function updateAnswered() {

    const visible = visibleQuestions();

    let answered = 0;

    visible.forEach(index => {

        const selected =
            document.querySelector(
                `input[name="question-${index}"]:checked`
            );

        if (selected) answered++;
    });

    document.getElementById("answeredCount").textContent = answered;
}

function gradeExam() {

    const visible = visibleQuestions();

    let correct = 0;
    let answered = 0;

    visible.forEach(index => {

        const q = questions[index];

        const questionDiv =
            document.querySelector(
                `.question[data-index="${index}"]`
            );

        if (!questionDiv) return;

        questionDiv.classList.remove("correct", "incorrect");

        const choices =
            questionDiv.querySelectorAll(".choice");

        choices.forEach(choice => {
            choice.classList.remove(
                "correct-answer",
                "wrong-answer"
            );
        });

        const selected =
            questionDiv.querySelector(
                `input[name="question-${index}"]:checked`
            );

        const explanation =
            questionDiv.querySelector(".explanation");

        explanation.classList.add("show");

        choices[q.answer].classList.add("correct-answer");

        if (selected) {

            answered++;

            const selectedIndex =
                Number(selected.value);

            if (selectedIndex === q.answer) {

                correct++;
                questionDiv.classList.add("correct");

            } else {

                questionDiv.classList.add("incorrect");

                choices[selectedIndex]
                    .classList.add("wrong-answer");
            }

        } else {

            questionDiv.classList.add("incorrect");
        }

    });

    const percent =
        visible.length
        ? Math.round(correct / visible.length * 100)
        : 0;

    document.getElementById("correctCount").textContent =
        `${correct}/${visible.length}`;

    document.getElementById("percentScore").textContent =
        `${percent}%`;

    const scorebox =
        document.getElementById("scorebox");

    let level;

    if (percent >= 90) {

        level =
        "Excellent. Your recognition of the material is at a strong placement-exam level.";

    } else if (percent >= 80) {

        level =
        "Strong. Review the questions you missed, especially terminology and composer-work associations.";

    } else if (percent >= 70) {

        level =
        "Developing well. Concentrate on genre/form distinctions and high-yield composer-work-technique associations.";

    } else {

        level =
        "Review recommended. Start with Tier 1 before moving back into Tier 2 and Tier 3.";
    }

    scorebox.innerHTML = `

        <h2>${percent}%</h2>

        <p>
            <strong>${correct}</strong> correct out of
            <strong>${visible.length}</strong>.
            You answered ${answered}.
        </p>

        <p>${level}</p>

    `;

    scorebox.classList.add("show");

    scorebox.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

function resetExam() {

    document
        .querySelectorAll('input[type="radio"]')
        .forEach(input => input.checked = false);

    document
        .querySelectorAll(".question")
        .forEach(q => {
            q.classList.remove("correct", "incorrect");
        });

    document
        .querySelectorAll(".choice")
        .forEach(c => {
            c.classList.remove(
                "correct-answer",
                "wrong-answer"
            );
        });

    document
        .querySelectorAll(".explanation")
        .forEach(e => e.classList.remove("show"));

    document.getElementById("correctCount").textContent = "—";
    document.getElementById("percentScore").textContent = "—";
    document.getElementById("scorebox").classList.remove("show");

    updateAnswered();
}

function shuffleQuestions() {

    for (
        let i = questionOrder.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            questionOrder[i],
            questionOrder[j]
        ] = [
            questionOrder[j],
            questionOrder[i]
        ];
    }

    resetExam();
    renderQuiz();
}

tierFilter.addEventListener("change", () => {
    resetExam();
    renderQuiz();
});

categoryFilter.addEventListener("change", () => {
    resetExam();
    renderQuiz();
});

renderQuiz();

</script>
